    - name: Attach the PHP service to the external PostgreSQL network
      ansible.builtin.shell: |
        set -euo pipefail

        python3 <<'PY'
        import os
        from pathlib import Path

        import yaml

        compose_path = Path(os.environ["COMPOSE_FILE"])
        php_container = os.environ["PHP_CONTAINER"]
        queue_worker_container = os.environ["QUEUE_WORKER_CONTAINER"]
        pg_network = os.environ["PG_NETWORK"]

        with compose_path.open("r", encoding="utf-8") as stream:
            compose = yaml.safe_load(stream)

        if not isinstance(compose, dict):
            raise SystemExit("Compose file must contain a top-level YAML mapping")

        services = compose.get("services")
        if not isinstance(services, dict) or not services:
            raise SystemExit("Compose file must contain a non-empty services mapping")

        changed = False

        required_containers = {php_container, queue_worker_container}
        found_containers = set()

        for service_name, service in services.items():
            if not isinstance(service, dict):
                continue

            container_name = service.get("container_name")
            if container_name not in required_containers:
                continue

            found_containers.add(container_name)
            networks = service.get("networks")

            if isinstance(networks, list):
                if pg_network not in networks:
                    networks.append(pg_network)
                    service["networks"] = networks
                    changed = True
            elif isinstance(networks, dict):
                if pg_network not in networks:
                    networks[pg_network] = None
                    changed = True
            else:
                service["networks"] = [pg_network]
                changed = True

        missing_containers = required_containers - found_containers
        if missing_containers:
            raise SystemExit(
                "Could not find required application container(s): "
                + ", ".join(sorted(missing_containers))
            )

        top_networks = compose.setdefault("networks", {})
        if not isinstance(top_networks, dict):
            raise SystemExit("Top-level networks must be a YAML mapping")

        required_pg_network = {
            "external": True,
            "name": pg_network,
        }

        if top_networks.get(pg_network) != required_pg_network:
            top_networks[pg_network] = required_pg_network
            changed = True

        if changed:
            temporary_path = compose_path.with_name(compose_path.name + ".tmp")
            with temporary_path.open("w", encoding="utf-8") as stream:
                yaml.safe_dump(
                    compose,
                    stream,
                    default_flow_style=False,
                    sort_keys=False,
                    allow_unicode=True,
                )
            temporary_path.replace(compose_path)

        print("UPDATED" if changed else "UNCHANGED")
        PY
      args:
        executable: /bin/bash
      environment:
        COMPOSE_FILE: "{{ laravel_compose_file }}"
        PHP_CONTAINER: "{{ laravel_php_container }}"
        QUEUE_WORKER_CONTAINER: "{{ laravel_queue_worker_container }}"
        PG_NETWORK: "{{ laravel_pg_network }}"
      register: laravel_pg_network_update
      changed_when: "'UPDATED' in laravel_pg_network_update.stdout"
      when: laravel_use_db

    - name: Validate Compose after PostgreSQL network attach
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - config
      args:
        chdir: "{{ laravel_project_dir }}"
      register: laravel_compose_after_pg_network
      changed_when: false
      failed_when: laravel_compose_after_pg_network.rc != 0
      when: laravel_use_db

    - name: Explain the PostgreSQL network attach
      ansible.builtin.debug:
        msg: >-
          Attached the PHP container to the external network
          {{ laravel_pg_network }} so DB_HOST={{ laravel_db_host }}
          can be resolved via Docker DNS. This runs whenever a database
          is enabled, regardless of the local/remote answer, since
          DB_HOST is commonly a Docker container name that only
          resolves via the network it lives on. If that is not the
          case for your setup, update laravel_pg_network to the
          correct network name and rerun.
      when: laravel_use_db

    - name: Inspect GeoServer Docker network
      ansible.builtin.command:
        argv:
          - docker
          - network
          - inspect
          - "{{ laravel_geoserver_network }}"
      register: laravel_geoserver_network_check
      changed_when: false
      failed_when: false
      when: laravel_use_geoserver

    - name: Require GeoServer Docker network
      ansible.builtin.assert:
        that:
          - laravel_geoserver_network_check.rc == 0
        fail_msg: >-
          GeoServer Docker network '{{ laravel_geoserver_network }}' does not
          exist. Run the GeoServer playbook first or set the correct network name.
      when: laravel_use_geoserver

    - name: Attach Laravel services to the GeoServer network
      ansible.builtin.shell: |
        set -euo pipefail

        python3 <<'PY'
        import os
        from pathlib import Path

        import yaml

        compose_path = Path(os.environ["COMPOSE_FILE"])
        required_containers = {
            os.environ["PHP_CONTAINER"],
            os.environ["QUEUE_WORKER_CONTAINER"],
        }
        geoserver_network = os.environ["GEOSERVER_NETWORK"]

        with compose_path.open("r", encoding="utf-8") as stream:
            compose = yaml.safe_load(stream)

        services = compose.get("services") if isinstance(compose, dict) else None
        if not isinstance(services, dict) or not services:
            raise SystemExit("Compose file must contain a non-empty services mapping")

        found = set()
        changed = False

        for service in services.values():
            if not isinstance(service, dict):
                continue
            if service.get("container_name") not in required_containers:
                continue

            found.add(service["container_name"])
            networks = service.get("networks")
            if isinstance(networks, list):
                if geoserver_network not in networks:
                    networks.append(geoserver_network)
                    changed = True
            elif isinstance(networks, dict):
                if geoserver_network not in networks:
                    networks[geoserver_network] = None
                    changed = True
            elif networks is None:
                service["networks"] = [geoserver_network]
                changed = True
            else:
                raise SystemExit("Unsupported networks configuration in Compose file")

        missing = required_containers - found
        if missing:
            raise SystemExit("Missing Laravel container(s): " + ", ".join(sorted(missing)))

        top_networks = compose.setdefault("networks", {})
        required_network = {"external": True, "name": geoserver_network}
        if top_networks.get(geoserver_network) != required_network:
            top_networks[geoserver_network] = required_network
            changed = True

        if changed:
            temporary_path = compose_path.with_name(compose_path.name + ".tmp")
            with temporary_path.open("w", encoding="utf-8") as stream:
                yaml.safe_dump(compose, stream, default_flow_style=False,
                               sort_keys=False, allow_unicode=True)
            temporary_path.replace(compose_path)

        print("UPDATED" if changed else "UNCHANGED")
        PY
      args:
        executable: /bin/bash
      environment:
        COMPOSE_FILE: "{{ laravel_compose_file }}"
        PHP_CONTAINER: "{{ laravel_php_container }}"
        QUEUE_WORKER_CONTAINER: "{{ laravel_queue_worker_container }}"
        GEOSERVER_NETWORK: "{{ laravel_geoserver_network }}"
      register: laravel_geoserver_network_update
      changed_when: "'UPDATED' in laravel_geoserver_network_update.stdout"
      when: laravel_use_geoserver

    - name: Validate Compose after GeoServer network attach
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - config
      args:
        chdir: "{{ laravel_project_dir }}"
      changed_when: false
      when: laravel_use_geoserver

    - name: Explain the GeoServer network attach
      ansible.builtin.debug:
        msg: >-
          Attached the Laravel PHP and queue-worker services to
          {{ laravel_geoserver_network }}. Laravel should use
          GEOSERVER_URL={{ laravel_geoserver_url }} through Docker DNS.
      when: laravel_use_geoserver

    # Bash STEP 8 - Create and update .env.
    - name: Check Laravel environment files
      ansible.builtin.stat:
        path: "{{ laravel_webapp_dir }}/.env"
      register: laravel_env_stat

    - name: Back up the existing Laravel environment
      ansible.builtin.copy:
        src: "{{ laravel_webapp_dir }}/.env"
        dest: "{{ laravel_webapp_dir }}/.env.bak.ansible"
        remote_src: true
        mode: preserve
      when: laravel_env_stat.stat.exists
      no_log: true

    - name: Check .env.example
      ansible.builtin.stat:
        path: "{{ laravel_webapp_dir }}/.env.example"
      register: laravel_env_example

    - name: Copy .env.example exactly to .env before applying deployment inputs
      ansible.builtin.copy:
        src: "{{ laravel_webapp_dir }}/.env.example"
        dest: "{{ laravel_webapp_dir }}/.env"
        remote_src: true
        owner: "{{ laravel_uid }}"
        group: "{{ laravel_gid }}"
        mode: "0640"
      when:
        - laravel_env_example.stat.exists
      no_log: true

    - name: Create a minimal Laravel environment when no example exists
      ansible.builtin.copy:
        dest: "{{ laravel_webapp_dir }}/.env"
        owner: "{{ laravel_uid }}"
        group: "{{ laravel_gid }}"
        mode: "0640"
        content: |
          APP_NAME=Laravel
          APP_ENV=production
          APP_KEY=
          APP_DEBUG=false
          APP_URL=http://localhost
          LOG_CHANNEL=stack
          LOG_LEVEL=debug
          DB_CONNECTION=pgsql
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_DATABASE=laravel
          DB_USERNAME=laravel
          DB_PASSWORD=
          CACHE_DRIVER=file
          QUEUE_CONNECTION=sync
          SESSION_DRIVER=file
          SESSION_LIFETIME=120
      when:
        - not laravel_env_stat.stat.exists
        - not laravel_env_example.stat.exists
      no_log: true

    - name: Set core Laravel environment values
      ansible.builtin.lineinfile:
        path: "{{ laravel_webapp_dir }}/.env"
        regexp: "^{{ item.key }}="
        line: '{{ item.key }}="{{ item.value }}"'
        create: true
        mode: "0640"
      loop:
        - { key: APP_NAME, value: "{{ laravel_app_name }}" }
        - { key: APP_ENV, value: "{{ laravel_app_env }}" }
        - { key: APP_DEBUG, value: "{{ laravel_app_debug | lower }}" }
        - { key: APP_URL, value: "https://{{ laravel_domain }}" }
      no_log: true

    - name: Set Laravel database environment values
      ansible.builtin.lineinfile:
        path: "{{ laravel_webapp_dir }}/.env"
        regexp: "^{{ item.key }}="
        line: '{{ item.key }}="{{ item.value }}"'
        create: true
        mode: "0640"
      loop:
        - { key: DB_HOST, value: "{{ laravel_db_host }}" }
        - { key: DB_PORT, value: "{{ laravel_db_port }}" }
        - { key: DB_DATABASE, value: "{{ laravel_effective_db_name }}" }
        - { key: DB_USERNAME, value: "{{ laravel_db_user }}" }
        - { key: DB_PASSWORD, value: "{{ laravel_db_password }}" }
      when: laravel_use_db
      no_log: true

    - name: Add GeoServer environment values
      ansible.builtin.lineinfile:
        path: "{{ laravel_webapp_dir }}/.env"
        regexp: "^{{ item.key }}="
        line: '{{ item.key }}="{{ item.value }}"'
        create: true
        mode: "0640"
      loop:
        - {
            key: GEOSERVER_INTERNAL_URL,
            value: "{{ laravel_geoserver_internal_url }}",
          }
        - {
            key: GEOSERVER_AUTH_KEY,
            value: "{{ laravel_geoserver_auth_key }}",
          }
        - {
            key: MAPFISH_PRINT_URL,
            value: "{{ laravel_mapfish_print_url }}",
          }
        - {
            key: API_KEY_GOOGLE,
            value: "{{ laravel_google_api_key }}",
          }
        - {
            key: GEOSERVER_WORKSPACE,
            value: "{{ laravel_geoserver_workspace }}",
          }
      when: laravel_use_geoserver
      no_log: true

    - name: Add requested extra environment values
      ansible.builtin.lineinfile:
        path: "{{ laravel_webapp_dir }}/.env"
        regexp: "^{{ item.split('=', 1)[0] | trim }}="
        line: "{{ item | trim }}"
        create: true
        mode: "0640"
      loop: "{{ laravel_extra_env.split(';') }}"
      when:
        - laravel_extra_env | trim | length > 0
        - item | trim | length > 0
        - "'=' in item"
      no_log: true

    - name: Write deployment seed account values to .env
      ansible.builtin.lineinfile:
        path: "{{ laravel_webapp_dir }}/.env"
        regexp: "^{{ item.key }}="
        line: '{{ item.key }}="{{ item.value }}"'
        create: true
        mode: "0640"
      loop:
        - { key: SEED_SUPER_ADMIN_NAME, value: "{{ laravel_seed_super_admin_name }}" }
        - { key: SEED_SUPER_ADMIN_USERNAME, value: "{{ laravel_seed_super_admin_username }}" }
        - { key: SEED_SUPER_ADMIN_EMAIL, value: "{{ laravel_seed_super_admin_email }}" }
        - { key: SEED_SUPER_ADMIN_PASSWORD, value: "{{ laravel_seed_super_admin_password }}" }
      no_log: true

    - name: Set PII environment values
      ansible.builtin.lineinfile:
        path: "{{ laravel_webapp_dir }}/.env"
        regexp: "^{{ item.key }}="
        line: '{{ item.key }}="{{ item.value }}"'
        create: true
        mode: "0640"
      loop:
        - { key: PII_KEY_PROVIDER, value: "file" }
        - { key: PII_ACTIVE_KEY_VERSION, value: "v1" }
        - { key: PII_KEY_V1_FILE, value: "{{ laravel_pii_key_container_file }}" }
        - { key: PII_KEY_V2_FILE, value: "" }
        - { key: PII_ALLOW_LEGACY_PLAINTEXT, value: "true" }
        - { key: PII_AUDIT_ENABLED, value: "true" }
        - { key: PII_KEY_BACKUP_INTERVAL_DAYS, value: "60" }
        - { key: PII_KEY_BACKUP_WARNING_DAYS, value: "5" }
        - { key: PII_EXPORT_MAX_BINS, value: "5000" }
        - { key: PII_EXPORT_MAX_APPLICATION_IDS, value: "5000" }
        - { key: PII_EXPORT_MAX_TAX_CODES, value: "5000" }
        - { key: PII_EXPORT_MAX_FILE_KB, value: "2048" }
      when: laravel_pii_setup
      no_log: true

    - name: Create the PII key directory outside the project repository
      ansible.builtin.file:
        path: "{{ laravel_pii_key_host_file | dirname }}"
        state: directory
        owner: "{{ laravel_uid }}"
        group: "{{ laravel_gid }}"
        mode: "0700"
      when: laravel_pii_setup

    - name: Check for an existing PII encryption key
      ansible.builtin.stat:
        path: "{{ laravel_pii_key_host_file }}"
      register: laravel_pii_key_stat
      when: laravel_pii_setup

    - name: Generate a PII encryption key only when one is absent
      ansible.builtin.command:
        argv:
          - openssl
          - rand
          - -base64
          - "32"
      register: laravel_pii_key_generated
      changed_when: true
      no_log: true
      when:
        - laravel_pii_setup
        - not laravel_pii_key_stat.stat.exists

    - name: Store the generated PII encryption key outside the project repository
      ansible.builtin.copy:
        dest: "{{ laravel_pii_key_host_file }}"
        owner: "{{ laravel_uid }}"
        group: "{{ laravel_gid }}"
        mode: "0600"
        content: "{{ laravel_pii_key_generated.stdout | trim }}\n"
      no_log: true
      when:
        - laravel_pii_setup
        - not laravel_pii_key_stat.stat.exists

    - name: Create the protected PII key backup directory
      ansible.builtin.file:
        path: "{{ laravel_pii_key_backup_file | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      when: laravel_pii_setup

    - name: Create a protected second copy of the PII encryption key
      ansible.builtin.copy:
        src: "{{ laravel_pii_key_host_file }}"
        dest: "{{ laravel_pii_key_backup_file }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
        force: false
      when: laravel_pii_setup
      no_log: true

    # Bash STEP 9 - Preserve ownership and permission behavior.
    - name: Set project ownership to the deployment user's UID and GID
      ansible.builtin.file:
        path: "{{ laravel_project_dir }}"
        owner: "{{ laravel_uid }}"
        group: "{{ laravel_gid }}"
        recurse: true

    - name: Set Laravel tree permissions
      ansible.builtin.file:
        path: "{{ laravel_webapp_dir }}"
        mode: "0755"
        recurse: true

    - name: Set writable Laravel paths
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ laravel_uid }}"
        group: "{{ laravel_gid }}"
        mode: "0777"
        recurse: true
      loop:
        - "{{ laravel_webapp_dir }}/storage"
        - "{{ laravel_webapp_dir }}/lang"
        - "{{ laravel_webapp_dir }}/bootstrap/cache"

    - name: Create pinned Node 22 and npm 10 tool Dockerfile
      ansible.builtin.copy:
        dest: "{{ laravel_npm_tool_dockerfile }}"
        owner: "{{ laravel_uid }}"
        group: "{{ laravel_gid }}"
        mode: "0644"
        content: |
          FROM {{ laravel_node_image }}
          USER root
          RUN npm install -g npm@{{ laravel_npm_version }} \
              && npm cache clean --force
          ENTRYPOINT ["npm"]
      when: laravel_npm_setup

    - name: Create Compose override for writable dependency tools
      ansible.builtin.copy:
        dest: "{{ laravel_tools_override_file }}"
        owner: "{{ laravel_uid }}"
        group: "{{ laravel_gid }}"
        mode: "0644"
        content: |
          services:
            {{ laravel_composer_service }}:
              user: "{{ laravel_uid }}:{{ laravel_gid }}"
              environment:
                COMPOSER_HOME: /tmp/composer
            {{ laravel_npm_service }}:
              build:
                context: "{{ laravel_project_dir }}"
                dockerfile: "Dockerfile.ansible-npm"
              image: "{{ laravel_npm_tool_image }}"
              user: "{{ laravel_uid }}:{{ laravel_gid }}"
              environment:
                NPM_CONFIG_CACHE: /tmp/npm-cache
                NPM_CONFIG_UPDATE_NOTIFIER: "false"
                NO_UPDATE_NOTIFIER: "1"

    - name: Validate dependency-tools Compose override
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ laravel_compose_file }}"
          - -f
          - "{{ laravel_tools_override_file }}"
          - config
      args:
        chdir: "{{ laravel_project_dir }}"
      changed_when: false

    - name: Build pinned Node 22 and npm 10 tool image
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ laravel_compose_file }}"
          - -f
          - "{{ laravel_tools_override_file }}"
          - build
          - "{{ laravel_npm_service }}"
      args:
        chdir: "{{ laravel_project_dir }}"
      register: laravel_npm_tool_build
      changed_when: true
      when: laravel_npm_setup

    - name: Verify pinned Node and npm versions used by deployment tools
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ laravel_compose_file }}"
          - -f
          - "{{ laravel_tools_override_file }}"
          - run
          - --rm
          - --no-deps
          - -T
          - --entrypoint
          - sh
          - "{{ laravel_npm_service }}"
          - -lc
          - "node -v && npm -v"
      args:
        chdir: "{{ laravel_project_dir }}"
      register: laravel_npm_runtime_versions
      changed_when: false
      when: laravel_npm_setup

    - name: Require exact Node and npm tool versions
      ansible.builtin.assert:
        that:
          - >-
            (laravel_npm_runtime_versions.stdout_lines |
            select('match', '^v' ~ laravel_node_version ~ '\\.') |
            list | length) > 0
          - "laravel_npm_version in laravel_npm_runtime_versions.stdout_lines"
        fail_msg: >-
          Expected Node v{{ laravel_node_version }} and npm {{ laravel_npm_version }},
          but the deployment tool reported: {{ laravel_npm_runtime_versions.stdout | default('unknown') }}.
        success_msg: >-
          Deployment NPM tool uses Node v{{ laravel_node_version }} and npm {{ laravel_npm_version }}.
      when: laravel_npm_setup

    # Bash STEP 10 - Build and start containers.
    - name: Build and start application containers
      ansible.builtin.command: docker compose up -d --build --remove-orphans
      args:
        chdir: "{{ laravel_project_dir }}"
      register: laravel_compose_up
      changed_when: >-
        'Created' in laravel_compose_up.stdout or
        'Recreated' in laravel_compose_up.stdout or
        'Started' in laravel_compose_up.stdout or
        'Building' in laravel_compose_up.stdout

    - name: Wait for the PHP container
      ansible.builtin.command:
        argv:
          [
            docker,
            inspect,
            -f,
            "{{ '{{.State.Running}}' }}",
            "{{ laravel_php_container }}",
          ]
      register: laravel_php_running
      changed_when: false
      retries: 30
      delay: 1
      until: laravel_php_running.stdout | trim == 'true'
      failed_when: false

    - name: Create the container PII key directory
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ laravel_php_container }}"
          - mkdir
          - -p
          - "{{ laravel_pii_key_container_file | dirname }}"
      changed_when: false
      when: laravel_pii_setup

    - name: Copy the PII key into the PHP container
      ansible.builtin.command:
        argv:
          - docker
          - cp
          - "{{ laravel_pii_key_host_file }}"
          - "{{ laravel_php_container }}:{{ laravel_pii_key_container_file }}"
      changed_when: true
      no_log: true
      when: laravel_pii_setup

    - name: Set restrictive permissions on the container PII key
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ laravel_php_container }}"
          - chmod
          - "0600"
          - "{{ laravel_pii_key_container_file }}"
      changed_when: true
      when: laravel_pii_setup

    # Bash STEP 11 - Detect dependency files and run the correct commands.
    - name: Check Composer manifest
      ansible.builtin.stat:
        path: "{{ laravel_webapp_dir }}/composer.json"
      register: laravel_composer_json

    - name: Set composer.json ownership and permissions
      ansible.builtin.file:
        path: "{{ laravel_webapp_dir }}/composer.json"
        owner: "{{ laravel_uid }}"
        group: "{{ laravel_gid }}"
        mode: "0644"
      when: laravel_composer_json.stat.exists

    - name: Check Composer lock file
      ansible.builtin.stat:
        path: "{{ laravel_webapp_dir }}/composer.lock"
      register: laravel_composer_lock

    - name: Check NPM manifest
      ansible.builtin.stat:
        path: "{{ laravel_webapp_dir }}/package.json"
      register: laravel_package_json

    - name: Check NPM lock file
      ansible.builtin.stat:
        path: "{{ laravel_webapp_dir }}/package-lock.json"
      register: laravel_package_lock

    - name: Set package.json ownership and permissions
      ansible.builtin.file:
        path: "{{ laravel_webapp_dir }}/package.json"
        owner: "{{ laravel_uid }}"
        group: "{{ laravel_gid }}"
        mode: "0644"
      when:
        - laravel_npm_setup
        - laravel_package_json.stat.exists

    - name: Read Docker Compose service names
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - config
          - --services
      args:
        chdir: "{{ laravel_project_dir }}"
      register: laravel_compose_services
      changed_when: false

    - name: Require Composer service when composer.json exists
      ansible.builtin.assert:
        that:
          - laravel_composer_service in laravel_compose_services.stdout_lines
        fail_msg: >-
          composer.json exists, but Compose service
          '{{ laravel_composer_service }}' was not found.
          Available services: {{ laravel_compose_services.stdout_lines | join(', ') }}
      when: laravel_composer_json.stat.exists

    - name: Require NPM service when package.json exists
      ansible.builtin.assert:
        that:
          - laravel_npm_service in laravel_compose_services.stdout_lines
        fail_msg: >-
          package.json exists, but Compose service
          '{{ laravel_npm_service }}' was not found.
          Available services: {{ laravel_compose_services.stdout_lines | join(', ') }}
      when:
        - laravel_npm_setup
        - laravel_package_json.stat.exists

    - name: Verify composer.json is visible in the Composer tool container
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ laravel_compose_file }}"
          - -f
          - "{{ laravel_tools_override_file }}"
          - run
          - --rm
          - --no-deps
          - -T
          - -v
          - "{{ laravel_webapp_dir }}:/app"
          - -w
          - /app
          - --entrypoint
          - sh
          - "{{ laravel_composer_service }}"
          - -lc
          - "test -f composer.json && printf '%s\\n' 'composer.json found in /app'"
      args:
        chdir: "{{ laravel_project_dir }}"
      changed_when: false
      when: laravel_composer_json.stat.exists

    - name: Make composer.lock writable before Composer update
      ansible.builtin.file:
        path: "{{ laravel_webapp_dir }}/composer.lock"
        state: file
        mode: "0777"
      when:
        - laravel_composer_json.stat.exists
        - laravel_composer_lock.stat.exists

    - name: Run Composer update when composer.lock exists
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ laravel_compose_file }}"
          - -f
          - "{{ laravel_tools_override_file }}"
          - run
          - --rm
          - --no-deps
          - -T
          - -v
          - "{{ laravel_webapp_dir }}:/app"
          - -w
          - /app
          - "{{ laravel_composer_service }}"
          - update
          - --with-all-dependencies
          - --no-security-blocking
          - --no-interaction
          - --prefer-dist
          - --optimize-autoloader
      args:
        chdir: "{{ laravel_project_dir }}"
      register: laravel_composer_install
      changed_when: true
      when:
        - laravel_composer_json.stat.exists
        - laravel_composer_lock.stat.exists

    - name: Restore composer.lock permissions after Composer update
      ansible.builtin.file:
        path: "{{ laravel_webapp_dir }}/composer.lock"
        state: file
        mode: "0775"
      when:
        - laravel_composer_json.stat.exists
        - laravel_composer_lock.stat.exists

    - name: Run Composer update when only composer.json exists
      when:
        - laravel_composer_json.stat.exists
        - not laravel_composer_lock.stat.exists
      block:
        - name: Run Composer update normally
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - -f
              - "{{ laravel_compose_file }}"
              - -f
              - "{{ laravel_tools_override_file }}"
              - run
              - --rm
              - --no-deps
              - -T
              - -v
              - "{{ laravel_webapp_dir }}:/app"
              - -w
              - /app
              - "{{ laravel_composer_service }}"
              - update
              - --with-all-dependencies
              - --no-security-blocking
              - --no-blocking
              - --no-interaction
              - --prefer-dist
              - --optimize-autoloader
          args:
            chdir: "{{ laravel_project_dir }}"
          register: laravel_composer_update
          changed_when: true

      rescue:
        - name: Temporarily apply mode 0777 after Composer permission failure
          ansible.builtin.file:
            path: "{{ laravel_webapp_dir }}"
            state: directory
            mode: "0777"
            recurse: true

        - name: Retry Composer update after applying mode 0777
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - -f
              - "{{ laravel_compose_file }}"
              - -f
              - "{{ laravel_tools_override_file }}"
              - run
              - --rm
              - --no-deps
              - -T
              - -v
              - "{{ laravel_webapp_dir }}:/app"
              - -w
              - /app
              - "{{ laravel_composer_service }}"
              - update
              - --with-all-dependencies
              - --no-security-blocking
              - --no-blocking
              - --no-interaction
              - --prefer-dist
              - --optimize-autoloader
          args:
            chdir: "{{ laravel_project_dir }}"
          register: laravel_composer_update_retry
          changed_when: true

      always:
        - name: Restore safer project-root permissions after Composer update
          ansible.builtin.file:
            path: "{{ laravel_webapp_dir }}"
            state: directory
            mode: "0755"

        - name: Recheck composer.lock after Composer update
          ansible.builtin.stat:
            path: "{{ laravel_webapp_dir }}/composer.lock"
          register: laravel_composer_lock_after_retry

        - name: Set composer.lock permissions when created
          ansible.builtin.file:
            path: "{{ laravel_webapp_dir }}/composer.lock"
            state: file
            mode: "0664"
          when: laravel_composer_lock_after_retry.stat.exists

    - name: Verify installed Composer platform requirements
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ laravel_compose_file }}"
          - -f
          - "{{ laravel_tools_override_file }}"
          - run
          - --rm
          - --no-deps
          - -T
          - -v
          - "{{ laravel_webapp_dir }}:/app"
          - -w
          - /app
          - "{{ laravel_composer_service }}"
          - check-platform-reqs
      args:
        chdir: "{{ laravel_project_dir }}"
      changed_when: false
      when: laravel_composer_json.stat.exists

    - name: Report when Composer files are absent
      ansible.builtin.debug:
        msg: >-
          composer.json was not found in {{ laravel_webapp_dir }}.
          Composer dependency setup was skipped.
      when: not laravel_composer_json.stat.exists

    # If the application does not provide a lock file, create one with the
    # deployment's pinned npm runtime. Once a lock file exists, the normal
    # normalization and npm ci path below is used.
    - name: Create package-lock.json when it is missing
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ laravel_compose_file }}"
          - -f
          - "{{ laravel_tools_override_file }}"
          - run
          - --rm
          - --no-deps
          - -T
          - -v
          - "{{ laravel_webapp_dir }}:/app"
          - -w
          - /app
          - --entrypoint
          - sh
          - "{{ laravel_npm_service }}"
          - -lc
          - "npm install --package-lock-only --ignore-scripts --no-audit --no-fund"
      args:
        chdir: "{{ laravel_project_dir }}"
      register: laravel_package_lock_install
      changed_when: true
      when:
        - laravel_npm_setup
        - laravel_package_json.stat.exists
        - not laravel_package_lock.stat.exists | default(false)

    - name: Refresh package-lock.json status after installation
      ansible.builtin.stat:
        path: "{{ laravel_webapp_dir }}/package-lock.json"
      register: laravel_package_lock
      when:
        - laravel_npm_setup
        - laravel_package_json.stat.exists

    - name: Require package-lock.json after installation attempt
      ansible.builtin.assert:
        that:
          - laravel_package_lock.stat.exists | default(false)
        fail_msg: >-
          package.json exists but package-lock.json could not be created.
          Check the npm service output and the application's package.json.
      when:
        - laravel_npm_setup
        - laravel_package_json.stat.exists

    - name: Set package-lock.json ownership and permissions
      ansible.builtin.file:
        path: "{{ laravel_webapp_dir }}/package-lock.json"
        owner: "{{ laravel_uid }}"
        group: "{{ laravel_gid }}"
        mode: "0664"
      when:
        - laravel_npm_setup
        - laravel_package_json.stat.exists
        - laravel_package_lock.stat.exists | default(false)

    - name: Remove existing node_modules before the frozen NPM installation
      ansible.builtin.file:
        path: "{{ laravel_webapp_dir }}/node_modules"
        state: absent
      when:
        - laravel_npm_setup
        - laravel_package_json.stat.exists
        - laravel_package_lock.stat.exists | default(false)

    - name: Back up package-lock.json before dependency normalization
      ansible.builtin.copy:
        src: "{{ laravel_webapp_dir }}/package-lock.json"
        dest: "{{ laravel_package_lock_backup }}"
        remote_src: true
        owner: "{{ laravel_uid }}"
        group: "{{ laravel_gid }}"
        mode: "0644"
        force: true
      when:
        - laravel_npm_setup
        - laravel_package_json.stat.exists
        - laravel_package_lock.stat.exists | default(false)

    - name: Pin Webpack to the Laravel Mix compatible version
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ laravel_compose_file }}"
          - -f
          - "{{ laravel_tools_override_file }}"
          - run
          - --rm
          - --no-deps
          - -T
          - -v
          - "{{ laravel_webapp_dir }}:/app"
          - -w
          - /app
          - --entrypoint
          - sh
          - "{{ laravel_npm_service }}"
          - -lc
          - >-
            npm install --no-save --ignore-scripts --no-audit --no-fund
            webpack@{{ laravel_webpack_compat_version }}
            webpackbar@{{ laravel_webpackbar_compat_version }}
      args:
        chdir: "{{ laravel_project_dir }}"
      register: laravel_webpack_pin
      changed_when: true
      when:
        - laravel_npm_setup
        - laravel_package_json.stat.exists
        - laravel_package_lock.stat.exists | default(false)

    # Normalize legacy lockfiles before npm ci without resolving dependencies.
    - name: Normalize package-lock.json without resolving dependencies
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - -v
          - "{{ laravel_webapp_dir }}:/app"
          - -w
          - /app
          - node:16
          - sh
          - -lc
          - >-
            LOCKFILE_VERSION=$(node -p "require('./package-lock.json').lockfileVersion || 1")
            && if [ "$LOCKFILE_VERSION" != "1" ]; then
            npm install --package-lock-only --lockfile-version=1
            --ignore-scripts --no-audit --no-fund
            && echo lockfile-normalized;
            fi
      args:
        chdir: "{{ laravel_project_dir }}"
      register: laravel_lockfile_normalization
      changed_when: "'lockfile-normalized' in laravel_lockfile_normalization.stdout"
      when:
        - laravel_npm_setup
        - laravel_package_json.stat.exists
        - laravel_package_lock.stat.exists | default(false)

    - name: Install frontend dependencies from the committed lock file
      block:
        - name: Run npm ci with Node 22 and npm 10.9.2
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - -f
              - "{{ laravel_compose_file }}"
              - -f
              - "{{ laravel_tools_override_file }}"
              - run
              - --rm
              - --no-deps
              - -T
              - -v
              - "{{ laravel_webapp_dir }}:/app"
              - -w
              - /app
              - --entrypoint
              - sh
              - "{{ laravel_npm_service }}"
              - -lc
              - "npm ci --no-audit --no-fund"
          args:
            chdir: "{{ laravel_project_dir }}"
          register: laravel_npm_ci
          changed_when: true

      rescue:
        # Retry once with a fresh ephemeral npm cache. This addresses npm
        # cache corruption without changing package.json or package-lock.json.
        - name: Retry npm ci after clearing the ephemeral npm cache
          block:
            - ansible.builtin.command:
                argv:
                  - docker
                  - compose
                  - -f
                  - "{{ laravel_compose_file }}"
                  - -f
                  - "{{ laravel_tools_override_file }}"
                  - run
                  - --rm
                  - --no-deps
                  - -T
                  - -v
                  - "{{ laravel_webapp_dir }}:/app"
                  - -w
                  - /app
                  - --entrypoint
                  - sh
                  - "{{ laravel_npm_service }}"
                  - -lc
                  - "rm -rf /tmp/npm-cache && mkdir -p /tmp/npm-cache && npm cache clean --force && npm ci --no-audit --no-fund"
              args:
                chdir: "{{ laravel_project_dir }}"
              register: laravel_npm_ci_retry
              changed_when: true

          rescue:
            - name: Repair package-lock.json with the deployment npm runtime
              ansible.builtin.command:
                argv:
                  - docker
                  - compose
                  - -f
                  - "{{ laravel_compose_file }}"
                  - -f
                  - "{{ laravel_tools_override_file }}"
                  - run
                  - --rm
                  - --no-deps
                  - -T
                  - -v
                  - "{{ laravel_webapp_dir }}:/app"
                  - -w
                  - /app
                  - --entrypoint
                  - sh
                  - "{{ laravel_npm_service }}"
                  - -lc
                  - >-
                    npm install --no-save --ignore-scripts --no-audit --no-fund
                    webpack@{{ laravel_webpack_compat_version }}
                    webpackbar@{{ laravel_webpackbar_compat_version }}
              args:
                chdir: "{{ laravel_project_dir }}"
              register: laravel_package_lock_repair
              changed_when: true

            - name: Remove node_modules after package-lock.json repair
              ansible.builtin.file:
                path: "{{ laravel_webapp_dir }}/node_modules"
                state: absent

            - name: Install frontend dependencies after package-lock.json repair
              block:
                - ansible.builtin.command:
                    argv:
                      - docker
                      - compose
                      - -f
                      - "{{ laravel_compose_file }}"
                      - -f
                      - "{{ laravel_tools_override_file }}"
                      - run
                      - --rm
                      - --no-deps
                      - -T
                      - -v
                      - "{{ laravel_webapp_dir }}:/app"
                      - -w
                      - /app
                      - --entrypoint
                      - sh
                      - "{{ laravel_npm_service }}"
                      - -lc
                      - "npm ci --no-audit --no-fund"
                  args:
                    chdir: "{{ laravel_project_dir }}"
                  register: laravel_npm_ci_after_repair
                  changed_when: true

              rescue:
                - name: Install frontend dependencies without enforcing the lock file
                  ansible.builtin.command:
                    argv:
                      - docker
                      - compose
                      - -f
                      - "{{ laravel_compose_file }}"
                      - -f
                      - "{{ laravel_tools_override_file }}"
                      - run
                      - --rm
                      - --no-deps
                      - -T
                      - -v
                      - "{{ laravel_webapp_dir }}:/app"
                      - -w
                      - /app
                      - --entrypoint
                      - sh
                      - "{{ laravel_npm_service }}"
                      - -lc
                      - >-
                        npm install --package-lock=false
                        --ignore-scripts --no-audit --no-fund
                        && SWIPER_SPEC=$(node -p "(require('./package.json').dependencies || {}).swiper || (require('./package.json').devDependencies || {}).swiper || ''")
                        && test -n "$SWIPER_SPEC"
                        && npm install --package-lock=false --no-save
                        --ignore-scripts --no-audit --no-fund
                        "swiper@$SWIPER_SPEC"
                        && npm install --package-lock=false --no-save
                        --ignore-scripts --no-audit --no-fund
                        webpack@{{ laravel_webpack_compat_version }}
                        webpackbar@{{ laravel_webpackbar_compat_version }}
                  args:
                    chdir: "{{ laravel_project_dir }}"
                  register: laravel_npm_non_frozen_install
                  changed_when: true

                - name: Report non-frozen NPM fallback
                  ansible.builtin.debug:
                    msg: >-
                      npm ci could not complete after automatic lock-file repair.
                      Dependencies were installed from package.json without
                      modifying package-lock.json. Webpack {{ laravel_webpack_compat_version }}
                      and Webpackbar {{ laravel_webpackbar_compat_version }} were pinned
                      for Laravel Mix.

            - name: Report automatic package-lock.json repair
              ansible.builtin.debug:
                msg: >-
                  package-lock.json was repaired automatically with Node
                  {{ laravel_node_version }}, npm {{ laravel_npm_version }},
                  Webpack {{ laravel_webpack_compat_version }}, and Webpackbar
                  {{ laravel_webpackbar_compat_version }}.
                  Original lock file backup: {{ laravel_package_lock_backup }}.

      when:
        - laravel_npm_setup
        - laravel_package_json.stat.exists
        - laravel_package_lock.stat.exists | default(false)

    # npm ci follows the versions recorded in package-lock.json. Reapply the
    # Laravel Mix-compatible webpack runtime afterward without changing the
    # application's manifest or lock file.
    - name: Reapply Laravel Mix compatible Webpack after npm ci
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ laravel_compose_file }}"
          - -f
          - "{{ laravel_tools_override_file }}"
          - run
          - --rm
          - --no-deps
          - -T
          - -v
          - "{{ laravel_webapp_dir }}:/app"
          - -w
          - /app
          - --entrypoint
          - sh
          - "{{ laravel_npm_service }}"
          - -lc
          - >-
            npm install --package-lock=false --no-save --ignore-scripts
            --no-audit --no-fund
            webpack@{{ laravel_webpack_compat_version }}
            webpackbar@{{ laravel_webpackbar_compat_version }}
      args:
        chdir: "{{ laravel_project_dir }}"
      register: laravel_webpack_post_ci_pin
      changed_when: true
      when:
        - laravel_npm_setup
        - laravel_package_json.stat.exists
        - laravel_package_lock.stat.exists | default(false)

    - name: Read the installed Webpack version
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ laravel_compose_file }}"
          - -f
          - "{{ laravel_tools_override_file }}"
          - run
          - --rm
          - --no-deps
          - -T
          - -v
          - "{{ laravel_webapp_dir }}:/app"
          - -w
          - /app
          - --entrypoint
          - node
          - "{{ laravel_npm_service }}"
          - -p
          - "require('webpack/package.json').version"
      args:
        chdir: "{{ laravel_project_dir }}"
      register: laravel_installed_webpack
      changed_when: false
      when:
        - laravel_npm_setup
        - laravel_package_json.stat.exists

    - name: Show installed Webpack version without changing it
      ansible.builtin.debug:
        msg: >-
          Installed Webpack version after dependency normalization:
          {{ laravel_installed_webpack.stdout | default('not detected') | trim }}.
          package.json is preserved; package-lock.json is backed up and may be
          normalized automatically for the legacy Laravel Mix build.
      when:
        - laravel_npm_setup
        - laravel_package_json.stat.exists

    - name: Check the installed Swiper package manifest
      ansible.builtin.stat:
        path: "{{ laravel_swiper_package_json }}"
      register: laravel_swiper_package_stat
      when:
        - laravel_npm_setup
        - laravel_package_json.stat.exists

    - name: Require the installed Swiper package manifest
      ansible.builtin.assert:
        that:
          - laravel_swiper_package_stat.stat.isreg | default(false)
        fail_msg: >-
          Swiper package.json was not found at
          {{ laravel_swiper_package_json }} after frontend dependency installation.
      when:
        - laravel_npm_setup
        - laravel_package_json.stat.exists

    - name: Add legacy Swiper bundle files to package exports
      ansible.builtin.shell: |
        set -euo pipefail

        python3 <<'PY'
        import json
        import os
        from pathlib import Path

        package_file = Path(os.environ["SWIPER_PACKAGE_JSON"])
        package_dir = package_file.parent

        required_files = {
            "./swiper-bundle.min.js": "./swiper-bundle.min.js",
            "./swiper-bundle.min.css": "./swiper-bundle.min.css",
        }

        missing_files = [
            target
            for target in required_files.values()
            if not (package_dir / target.removeprefix("./")).is_file()
        ]
        if missing_files:
            raise SystemExit(
                "The requested Swiper bundle file(s) do not exist: "
                + ", ".join(missing_files)
            )

        with package_file.open("r", encoding="utf-8") as stream:
            package = json.load(stream)

        exports = package.get("exports")
        if exports is None:
            exports = {}
            package["exports"] = exports

        if not isinstance(exports, dict):
            raise SystemExit(
                "Swiper package.json has an unsupported non-object exports field"
            )

        changed = False
        for export_name, target in required_files.items():
            if exports.get(export_name) != target:
                exports[export_name] = target
                changed = True

        if not changed:
            print("UNCHANGED")
            raise SystemExit(0)

        temporary_file = package_file.with_name(package_file.name + ".tmp")
        with temporary_file.open("w", encoding="utf-8") as stream:
            json.dump(package, stream, indent=2, ensure_ascii=False)
            stream.write("\n")

        temporary_file.replace(package_file)
        print("UPDATED")
        PY
      args:
        executable: /bin/bash
      environment:
        SWIPER_PACKAGE_JSON: "{{ laravel_swiper_package_json }}"
      register: laravel_swiper_exports_update
      changed_when: "'UPDATED' in laravel_swiper_exports_update.stdout"
      when:
        - laravel_npm_setup
        - laravel_package_json.stat.exists
        - laravel_swiper_package_stat.stat.isreg | default(false)

    - name: Verify legacy Swiper bundle exports
      ansible.builtin.shell: |
        set -euo pipefail

        python3 <<'PY'
        import json
        import os
        from pathlib import Path

        package_file = Path(os.environ["SWIPER_PACKAGE_JSON"])

        with package_file.open("r", encoding="utf-8") as stream:
            package = json.load(stream)

        exports = package.get("exports", {})
        expected = {
            "./swiper-bundle.min.js": "./swiper-bundle.min.js",
            "./swiper-bundle.min.css": "./swiper-bundle.min.css",
        }

        for export_name, target in expected.items():
            if exports.get(export_name) != target:
                raise SystemExit(
                    f"Missing or invalid Swiper export: "
                    f"{export_name} -> {target}"
                )

        print("Swiper legacy bundle exports verified.")
        PY
      args:
        executable: /bin/bash
      environment:
        SWIPER_PACKAGE_JSON: "{{ laravel_swiper_package_json }}"
      changed_when: false
      when:
        - laravel_npm_setup
        - laravel_package_json.stat.exists
        - laravel_swiper_package_stat.stat.isreg | default(false)

    - name: Show Swiper package export correction result
      ansible.builtin.debug:
        msg: >-
          Swiper package exports:
          {{ laravel_swiper_exports_update.stdout | default('SKIPPED') | trim }}.
          Application source files were not modified.
      when:
        - laravel_npm_setup
        - laravel_package_json.stat.exists

    - name: Select the production frontend build script
      ansible.builtin.shell: |
        set -euo pipefail

        python3 <<'PY'
        import json
        import os
        from pathlib import Path

        package_file = Path(os.environ["PACKAGE_JSON"])

        with package_file.open("r", encoding="utf-8") as stream:
            package = json.load(stream)

        scripts = package.get("scripts", {})

        for script_name in ("production", "prod", "build"):
            if script_name in scripts:
                print(script_name)
                raise SystemExit(0)

        print("")
        PY
      args:
        executable: /bin/bash
      environment:
        PACKAGE_JSON: "{{ laravel_webapp_dir }}/package.json"
      register: laravel_npm_build_script_result
      changed_when: false
      when:
        - laravel_npm_setup
        - laravel_package_json.stat.exists

    - name: Store the selected frontend build script
      ansible.builtin.set_fact:
        laravel_npm_build_script: >-
          {{ laravel_npm_build_script_result.stdout | default('') | trim }}
      when:
        - laravel_npm_setup
        - laravel_package_json.stat.exists

    - name: Build production frontend assets
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ laravel_compose_file }}"
          - -f
          - "{{ laravel_tools_override_file }}"
          - run
          - --rm
          - --no-deps
          - -T
          - -v
          - "{{ laravel_webapp_dir }}:/app"
          - -w
          - /app
          - "{{ laravel_npm_service }}"
          - run
          - "{{ laravel_npm_build_script }}"
      args:
        chdir: "{{ laravel_project_dir }}"
      register: laravel_npm_build
      changed_when: true
      when:
        - laravel_npm_setup
        - laravel_package_json.stat.exists
        - laravel_npm_build_script | default('') | length > 0

    - name: Report when no production frontend build script exists
      ansible.builtin.debug:
        msg: >-
          package.json has no production, prod, or build script.
          Dependency installation completed, but the asset build was skipped.
      when:
        - laravel_npm_setup
        - laravel_package_json.stat.exists
        - laravel_npm_build_script | default('') | length == 0

    - name: Report when package.json is absent
      ansible.builtin.debug:
        msg: >-
          package.json was not found in {{ laravel_webapp_dir }}.
          NPM dependency and asset-build tasks were skipped.
      when:
        - laravel_npm_setup
        - not laravel_package_json.stat.exists

    - name: Verify the dynamic Laravel path inside the PHP container
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -w
          - /
          - "{{ laravel_php_container }}"
          - test
          - -f
          - "{{ laravel_container_app_dir }}/artisan"
      changed_when: false
      register: laravel_dynamic_path_check
      failed_when: laravel_dynamic_path_check.rc != 0

    - name: Fix .env ownership inside the PHP container before writing to it
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -w
          - /
          - "{{ laravel_php_container }}"
          - chown
          - www-data:www-data
          - "{{ laravel_container_app_dir }}/.env"
      changed_when: true

    - name: Check current APP_KEY value in .env
      ansible.builtin.shell: >-
        grep -m1 '^APP_KEY=' "{{ laravel_webapp_dir }}/.env" | cut -d '=' -f2-
      args:
        executable: /bin/bash
      register: laravel_current_app_key
      changed_when: false
      failed_when: false
      no_log: true

    - name: Generate Laravel application key
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -w
          - /
          - "{{ laravel_php_container }}"
          - php
          - "{{ laravel_container_app_dir }}/artisan"
          - key:generate
          - --force
      register: laravel_key_generate
      changed_when: laravel_key_generate.rc == 0
      when: laravel_current_app_key.stdout | default('') | trim | length == 0

    - name: Report when APP_KEY already exists
      ansible.builtin.debug:
        msg: "APP_KEY already set in .env; skipping key:generate."
      when: laravel_current_app_key.stdout | default('') | trim | length > 0

    - name: Check the configured PostgreSQL Docker network
      ansible.builtin.command:
        argv:
          - docker
          - network
          - inspect
          - "{{ laravel_pg_network }}"
      register: laravel_pg_network_check
      changed_when: false
      when:
        - laravel_use_db
        - laravel_db_type | lower == 'local'

    - name: Require the configured PostgreSQL Docker network
      ansible.builtin.assert:
        that:
          - laravel_pg_network_check.rc == 0
        fail_msg: >-
          PostgreSQL Docker network '{{ laravel_pg_network }}' was not found.
          Start or create the PostgreSQL stack on this network before deploying
          the Laravel project.
      when:
        - laravel_use_db
        - laravel_db_type | lower == 'local'

    - name: Check whether PHP is attached to the PostgreSQL network
      ansible.builtin.shell: >-
        docker network inspect {{ laravel_pg_network | quote }}
        --format '{{ '{{json .Containers}}' }}' |
        grep -F {{ laravel_php_container | quote }}
      args:
        executable: /bin/bash
      register: laravel_php_pg_network_membership
      changed_when: false
      failed_when: false
      when:
        - laravel_use_db
        - laravel_db_type | lower == 'local'

    - name: Attach PHP to the PostgreSQL network when missing
      ansible.builtin.command:
        argv:
          - docker
          - network
          - connect
          - "{{ laravel_pg_network }}"
          - "{{ laravel_php_container }}"
      when:
        - laravel_use_db
        - laravel_db_type | lower == 'local'
        - laravel_php_pg_network_membership.rc != 0

    - name: Probe PostgreSQL connectivity before changing the firewall
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ laravel_php_container }}"
          - php
          - -r
          - >-
            $host = "{{ laravel_db_host }}";
            $port = {{ laravel_db_port | int }};
            $resolved = gethostbyname($host);
            if ($resolved === $host) { exit(2); }
            $socket = @fsockopen($host, $port, $errno, $error, 5);
            if (!$socket) { exit(1); }
            fclose($socket);
            exit(0);
      register: laravel_database_connectivity_probe
      changed_when: false
      failed_when: false
      when:
        - laravel_use_db
        - laravel_db_type | lower == 'local'

    - name: Read the PostgreSQL Docker network subnet when TCP access fails
      ansible.builtin.shell: >-
        docker network inspect {{ laravel_pg_network | quote }}
        --format '{{ '{{(index .IPAM.Config 0).Subnet}}' }}'
      args:
        executable: /bin/bash
      register: laravel_pg_network_subnet
      changed_when: false
      when:
        - laravel_use_db
        - laravel_db_type | lower == 'local'
        - laravel_database_connectivity_probe.rc | int == 1

    - name: Check the Docker firewall rule for PostgreSQL container traffic
      ansible.builtin.command:
        argv:
          - iptables
          - -C
          - DOCKER-USER
          - -s
          - "{{ laravel_pg_network_subnet.stdout | trim }}"
          - -d
          - "{{ laravel_pg_network_subnet.stdout | trim }}"
          - -p
          - tcp
          - --dport
          - "{{ laravel_db_port | int }}"
          - -m
          - comment
          - --comment
          - laravel_allow_postgres_container_traffic
          - -j
          - ACCEPT
      register: laravel_pg_firewall_rule
      changed_when: false
      failed_when: false
      when:
        - laravel_use_db
        - laravel_db_type | lower == 'local'
        - laravel_database_connectivity_probe.rc | int == 1

    - name: Allow PHP-to-PostgreSQL traffic through the Docker firewall
      ansible.builtin.command:
        argv:
          - iptables
          - -I
          - DOCKER-USER
          - "1"
          - -s
          - "{{ laravel_pg_network_subnet.stdout | trim }}"
          - -d
          - "{{ laravel_pg_network_subnet.stdout | trim }}"
          - -p
          - tcp
          - --dport
          - "{{ laravel_db_port | int }}"
          - -m
          - comment
          - --comment
          - laravel_allow_postgres_container_traffic
          - -j
          - ACCEPT
      when:
        - laravel_use_db
        - laravel_db_type | lower == 'local'
        - laravel_database_connectivity_probe.rc | int == 1
        - laravel_pg_firewall_rule.rc != 0

    - name: Persist the Laravel PostgreSQL Docker firewall rule
      ansible.builtin.shell: |
        set -euo pipefail
        if command -v netfilter-persistent >/dev/null 2>&1; then
          netfilter-persistent save
        elif [[ -d /etc/iptables ]]; then
          iptables-save > /etc/iptables/rules.v4
        fi
      args:
        executable: /bin/bash
      changed_when: false
      when:
        - laravel_use_db
        - laravel_db_type | lower == 'local'
        - laravel_database_connectivity_probe.rc | int == 1
        - laravel_pg_firewall_rule.rc != 0

    - name: Test PostgreSQL connectivity from PHP
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ laravel_php_container }}"
          - php
          - -r
          - >-
            $host = "{{ laravel_db_host }}";
            $port = {{ laravel_db_port | int }};
            $resolved = gethostbyname($host);
            if ($resolved === $host) {
              fwrite(STDERR, "DNS lookup failed for {$host}\\n");
              exit(2);
            }
            $socket = @fsockopen($host, $port, $errno, $error, 5);
            if (!$socket) {
              fwrite(STDERR, "TCP connection to {$host} ({$resolved}):{$port} failed: [{$errno}] {$error}\\n");
              exit(1);
            }
            fclose($socket);
            exit(0);
      register: laravel_database_connectivity
      changed_when: false
      failed_when: laravel_database_connectivity.rc != 0
      retries: 15
      delay: 2
      until: laravel_database_connectivity.rc == 0
      when:
        - laravel_use_db
        - laravel_db_type | lower == 'local'

    - name: Ask whether to run URL-binding migrations
      ansible.builtin.pause:
        prompt: "Run URL-binding migrations now? (yes/no; press ENTER for yes)"
        echo: true
      register: laravel_url_binding_prompt
      when: laravel_pii_setup

    - name: Store URL-binding migration decision
      ansible.builtin.set_fact:
        laravel_run_url_binding: >-
          {{ laravel_url_binding_prompt.user_input | default('') | trim | length == 0
             or laravel_url_binding_prompt.user_input | lower in ['y', 'yes', 'true', '1'] }}
      when: laravel_pii_setup

    - name: Run URL-binding migrations before PII migrations
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -i
          - -w
          - /
          - "{{ laravel_php_container }}"
          - php
          - "{{ laravel_container_app_dir }}/artisan"
          - migrate:url-binding
        stdin: "yes\n"
        stdin_add_newline: false
      register: laravel_url_binding_migrations
      changed_when: true
      when:
        - laravel_pii_setup
        - not laravel_database_empty
        - laravel_run_url_binding

    - name: Clear cached configuration before the PII configuration check
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -w
          - /
          - "{{ laravel_php_container }}"
          - php
          - "{{ laravel_container_app_dir }}/artisan"
          - optimize:clear
      changed_when: true
      when:
        - laravel_pii_setup
        - not laravel_database_empty

    - name: Check PII configuration
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -w
          - /
          - "{{ laravel_php_container }}"
          - php
          - "{{ laravel_container_app_dir }}/artisan"
          - pii:check-configuration
      register: laravel_pii_configuration_check
      changed_when: false
      when:
        - laravel_pii_setup
        - not laravel_database_empty

    - name: Run base Laravel migrations for an empty database
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -w
          - /
          - "{{ laravel_php_container }}"
          - php
          - "{{ laravel_container_app_dir }}/artisan"
          - migrate
          - --force
      register: laravel_base_migrations
      changed_when: true
      when:
        - laravel_pii_setup
        - laravel_database_empty

    - name: Run URL-binding migrations after the base schema for an empty database
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -i
          - -w
          - /
          - "{{ laravel_php_container }}"
          - php
          - "{{ laravel_container_app_dir }}/artisan"
          - migrate:url-binding
        stdin: "yes\n"
        stdin_add_newline: false
      register: laravel_empty_url_binding_migrations
      changed_when: true
      when:
        - laravel_pii_setup
        - laravel_database_empty
        - laravel_run_url_binding

    - name: Clear cached configuration after the base schema for an empty database
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -w
          - /
          - "{{ laravel_php_container }}"
          - php
          - "{{ laravel_container_app_dir }}/artisan"
          - optimize:clear
      changed_when: true
      when:
        - laravel_pii_setup
        - laravel_database_empty

    - name: Check PII configuration after the base schema for an empty database
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -w
          - /
          - "{{ laravel_php_container }}"
          - php
          - "{{ laravel_container_app_dir }}/artisan"
          - pii:check-configuration
      register: laravel_empty_pii_configuration_check
      changed_when: false
      when:
        - laravel_pii_setup
        - laravel_database_empty

    - name: Run PII database migrations
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -w
          - /
          - "{{ laravel_php_container }}"
          - php
          - "{{ laravel_container_app_dir }}/artisan"
          - migrate:pii
          - --force
      register: laravel_pii_migrations
      changed_when: true
      when: laravel_pii_setup

    - name: Seed PII owner permissions
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -w
          - /
          - "{{ laravel_php_container }}"
          - php
          - "{{ laravel_container_app_dir }}/artisan"
          - db:seed
          - --class=Database\\Seeders\\OwnerPiiPermissionsSeeder
          - --force
      changed_when: true
      when: laravel_pii_setup

    - name: Seed PII application permissions
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -w
          - /
          - "{{ laravel_php_container }}"
          - php
          - "{{ laravel_container_app_dir }}/artisan"
          - db:seed
          - --class=Database\\Seeders\\ApplicationPiiPermissionsSeeder
          - --force
      changed_when: true
      when: laravel_pii_setup

    - name: Seed PII property tax permissions
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -w
          - /
          - "{{ laravel_php_container }}"
          - php
          - "{{ laravel_container_app_dir }}/artisan"
          - db:seed
          - --class=Database\\Seeders\\PropertyTaxPiiPermissionsSeeder
          - --force
      changed_when: true
      when: laravel_pii_setup

    - name: Reset the permission cache after PII seeding
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -w
          - /
          - "{{ laravel_php_container }}"
          - php
          - "{{ laravel_container_app_dir }}/artisan"
          - permission:cache-reset
      changed_when: true
      when: laravel_pii_setup

    - name: Clear cached configuration after PII setup
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -w
          - /
          - "{{ laravel_php_container }}"
          - php
          - "{{ laravel_container_app_dir }}/artisan"
          - optimize:clear
      changed_when: true
      when: laravel_pii_setup

    - name: Create the PII database backup directory
      ansible.builtin.file:
        path: "{{ laravel_pii_db_backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      when:
        - laravel_pii_setup
        - laravel_pii_db_backup_required

    - name: Back up the PostgreSQL database before PII processing
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - "{{ 'host' if laravel_db_type | lower == 'remote' else laravel_pg_network }}"
          - --env
          - "PGPASSWORD={{ laravel_db_password }}"
          - -v
          - "{{ laravel_pii_db_backup_dir }}:/backup"
          - postgres:14
          - pg_dump
          - -h
          - "{{ laravel_db_host }}"
          - -p
          - "{{ laravel_db_port }}"
          - -U
          - "{{ laravel_db_user }}"
          - -d
          - "{{ laravel_effective_db_name }}"
          - -Fc
          - -f
          - "/backup/{{ laravel_pii_db_backup_file | basename }}"
      register: laravel_pii_db_backup
      changed_when: true
      no_log: true
      when:
        - laravel_pii_setup
        - laravel_pii_db_backup_required

    - name: Verify the PII database backup was created
      ansible.builtin.stat:
        path: "{{ laravel_pii_db_backup_file }}"
      register: laravel_pii_db_backup_stat
      when:
        - laravel_pii_setup
        - laravel_pii_db_backup_required

    - name: Require a non-empty PII database backup
      ansible.builtin.assert:
        that:
          - laravel_pii_db_backup_stat.stat.exists
          - laravel_pii_db_backup_stat.stat.size | int > 0
        fail_msg: "The PostgreSQL backup was not created or is empty. PII processing has been stopped."
      when:
        - laravel_pii_setup
        - laravel_pii_db_backup_required

    - name: Ask whether to run the remaining PII process
      ansible.builtin.pause:
        prompt: >-
          Run PII dry-run, encryption backfill, verification, disable legacy
          plaintext, and tests? (y/n)
        echo: true
      register: laravel_pii_process_prompt
      when: laravel_pii_setup

    - name: Store the PII process decision
      ansible.builtin.set_fact:
        laravel_pii_backfill: >-
          {{ laravel_pii_process_prompt.user_input | default('n') | lower
             in ['y', 'yes', 'true', '1'] }}
      when: laravel_pii_setup

    - name: Dry-run encryption for existing owner PII
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -w
          - /
          - "{{ laravel_php_container }}"
          - php
          - "{{ laravel_container_app_dir }}/artisan"
          - pii:encrypt-existing-owners
          - --dry-run
      register: laravel_pii_owner_dry_run
      changed_when: false
      when: laravel_pii_backfill

    - name: Dry-run encryption for existing application PII
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -w
          - /
          - "{{ laravel_php_container }}"
          - php
          - "{{ laravel_container_app_dir }}/artisan"
          - pii:encrypt-existing-applications
          - --dry-run
      register: laravel_pii_application_dry_run
      changed_when: false
      when: laravel_pii_backfill

    - name: Dry-run encryption for existing property-tax PII
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -w
          - /
          - "{{ laravel_php_container }}"
          - php
          - "{{ laravel_container_app_dir }}/artisan"
          - pii:encrypt-existing-property-tax
          - --dry-run
      register: laravel_pii_property_tax_dry_run
      changed_when: false
      when: laravel_pii_backfill

    - name: Encrypt existing owner PII after backup confirmation
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -w
          - /
          - "{{ laravel_php_container }}"
          - php
          - "{{ laravel_container_app_dir }}/artisan"
          - pii:encrypt-existing-owners
      register: laravel_pii_owner_backfill
      changed_when: true
      no_log: true
      when: laravel_pii_backfill

    - name: Encrypt existing application PII after backup confirmation
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -w
          - /
          - "{{ laravel_php_container }}"
          - php
          - "{{ laravel_container_app_dir }}/artisan"
          - pii:encrypt-existing-applications
      register: laravel_pii_application_backfill
      changed_when: true
      no_log: true
      when: laravel_pii_backfill

    - name: Encrypt existing property-tax PII after backup confirmation
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -w
          - /
          - "{{ laravel_php_container }}"
          - php
          - "{{ laravel_container_app_dir }}/artisan"
          - pii:encrypt-existing-property-tax
      register: laravel_pii_property_tax_backfill
      changed_when: true
      no_log: true
      when: laravel_pii_backfill

    - name: Verify owner PII encryption
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -w
          - /
          - "{{ laravel_php_container }}"
          - php
          - "{{ laravel_container_app_dir }}/artisan"
          - pii:verify-owner-encryption
      register: laravel_pii_owner_verification
      changed_when: false
      when: laravel_pii_backfill

    - name: Verify application PII encryption
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -w
          - /
          - "{{ laravel_php_container }}"
          - php
          - "{{ laravel_container_app_dir }}/artisan"
          - pii:verify-application-encryption
      register: laravel_pii_application_verification
      changed_when: false
      when: laravel_pii_backfill

    - name: Verify property-tax PII encryption
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -w
          - /
          - "{{ laravel_php_container }}"
          - php
          - "{{ laravel_container_app_dir }}/artisan"
          - pii:verify-property-tax-encryption
      register: laravel_pii_property_tax_verification
      changed_when: false
      when: laravel_pii_backfill

    - name: Disable legacy plaintext PII compatibility after verification
      ansible.builtin.lineinfile:
        path: "{{ laravel_webapp_dir }}/.env"
        regexp: "^PII_ALLOW_LEGACY_PLAINTEXT="
        line: 'PII_ALLOW_LEGACY_PLAINTEXT="false"'
        create: true
        mode: "0640"
      when: laravel_pii_backfill
      no_log: true

    - name: Clear cached configuration after disabling legacy plaintext
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -w
          - /
          - "{{ laravel_php_container }}"
          - php
          - "{{ laravel_container_app_dir }}/artisan"
          - optimize:clear
      changed_when: true
      when: laravel_pii_backfill

    - name: Run the final PII configuration check
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -w
          - /
          - "{{ laravel_php_container }}"
          - php
          - "{{ laravel_container_app_dir }}/artisan"
          - pii:check-configuration
      register: laravel_pii_final_configuration_check
      changed_when: false
      when: laravel_pii_backfill

    - name: Run the PII test suite
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -w
          - /
          - "{{ laravel_php_container }}"
          - php
          - "{{ laravel_container_app_dir }}/artisan"
          - test
          - --filter=Pii
      register: laravel_pii_tests
      changed_when: false
      when: laravel_pii_backfill

    # `artisan storage:link` runs as the unprivileged Laravel container user.
    # The application source is a host bind mount, so PHP cannot create the
    # link when `public` was checked out or copied by root. Create the link on
    # the host with Ansible instead; this uses the already-resolved dynamic
    # source path and is idempotent regardless of the container UID.
    - name: Ensure Laravel public directory is writable by the runtime UID
      ansible.builtin.file:
        path: "{{ laravel_webapp_dir }}/public"
        state: directory
        owner: "{{ laravel_uid }}"
        group: "{{ laravel_gid }}"
        mode: "0755"

    - name: Create Laravel public storage link from the host
      ansible.builtin.file:
        src: "{{ laravel_webapp_dir }}/storage/app/public"
        dest: "{{ laravel_webapp_dir }}/public/storage"
        state: link
      register: laravel_storage_link

    - name: Clear Laravel optimized caches
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -w
          - /
          - "{{ laravel_php_container }}"
          - php
          - "{{ laravel_container_app_dir }}/artisan"
          - optimize:clear
      changed_when: true

    - name: Fix Laravel runtime ownership inside the PHP container
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -w
          - /
          - "{{ laravel_php_container }}"
          - chown
          - -R
          - www-data:www-data
          - "{{ laravel_container_app_dir }}/storage"
          - "{{ laravel_container_app_dir }}/bootstrap/cache"
      changed_when: true

    - name: Rebuild and keep all application services running
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - up
          - -d
          - --build
          - --remove-orphans
      args:
        chdir: "{{ laravel_project_dir }}"
      register: laravel_final_compose_up
      changed_when: true

    - name: Wait for PHP after the final Compose build
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - -f
          - "{{ '{{.State.Running}}' }}"
          - "{{ laravel_php_container }}"
      register: laravel_final_php_wait
      changed_when: false
      retries: 30
      delay: 2
      until:
        - laravel_final_php_wait.rc == 0
        - laravel_final_php_wait.stdout | trim == 'true'

    - name: Verify the running PHP patch version
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ laravel_php_container }}"
          - php
          - -r
          - "echo PHP_VERSION;"
      register: laravel_runtime_php_version
      changed_when: false
      failed_when: laravel_runtime_php_version.stdout | trim != laravel_php_version

    # Bash STEP 12 - Verification.
    - name: Verify PHP container state
      ansible.builtin.command:
        argv:
          [
            docker,
            inspect,
            -f,
            "{{ '{{.State.Running}}' }}",
            "{{ laravel_php_container }}",
          ]
      changed_when: false
      register: laravel_final_php_state
      failed_when: false

    - name: Render Laravel project configuration for shared Nginx
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/08_shared_nginx_project.conf.j2"
        dest: "{{ laravel_shared_project_config_file }}"
        owner: root
        group: root
        mode: "0644"
        backup: true
      vars:
        shared_domain: "{{ laravel_domain }}"
        shared_nginx_app_root: "/srv/projects/{{ laravel_project_name }}/src/{{ laravel_webapp_name }}"
        shared_php_alias: "{{ laravel_php_container }}"
        shared_php_app_root: "{{ laravel_container_app_dir }}"

    - name: Inspect shared Nginx running state
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - -f
          - "{{ '{{.State.Running}}' }}"
          - "{{ laravel_shared_nginx_container }}"
      register: laravel_shared_nginx_state
      changed_when: false
      failed_when: false

    - name: Start shared Nginx when it is stopped
      ansible.builtin.command:
        argv:
          - docker
          - start
          - "{{ laravel_shared_nginx_container }}"
      when:
        - laravel_shared_nginx_state.rc == 0
        - laravel_shared_nginx_state.stdout | trim != 'true'
      changed_when: true

    - name: Reload shared Nginx after adding the Laravel project
      ansible.builtin.command:
        argv:
          - docker
          - kill
          - --signal
          - HUP
          - "{{ laravel_shared_nginx_container }}"
      changed_when: true

    - name: Verify PHP container is attached to the shared web network
      ansible.builtin.shell: >-
        docker network inspect {{ laravel_shared_web_network | quote }} --format '{{ '{{json .Containers}}' }}' |
        grep -F {{ laravel_php_container | quote }}
      args:
        executable: /bin/bash
      changed_when: false
      register: laravel_network_verify
      failed_when: false

    - name: Check published Compose ports
      ansible.builtin.command: docker compose ps --format json
      args:
        chdir: "{{ laravel_project_dir }}"
      changed_when: false
      register: laravel_compose_ps
      failed_when: false

    # Final read-only verification at the deployed shared-Nginx boundary.
    # Laravel remains the source of truth for Content-Security-Policy and
    # X-Frame-Options.
    - name: Check whether shared Nginx is available for clickjacking verification
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - "{{ docker_nginx_container_name }}"
      register: docker_nginx_container_status
      changed_when: false
      failed_when: false
      when: docker_verify_clickjacking_headers | bool

    - name: Require shared Nginx for clickjacking verification
      ansible.builtin.assert:
        that:
          - docker_nginx_container_status.rc == 0
        fail_msg: >-
          Shared Nginx container {{ docker_nginx_container_name }} was not
          found after Laravel deployment.
      when: docker_verify_clickjacking_headers | bool

    - name: Inspect effective shared Nginx clickjacking configuration
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ docker_nginx_container_name }}"
          - nginx
          - -T
      register: docker_nginx_effective_config
      changed_when: false
      failed_when: false
      when: docker_verify_clickjacking_headers | bool

    - name: Detect Nginx directives that compete with Laravel header ownership
      ansible.builtin.shell: >-
        set -o pipefail &&
        printf '%s\n' "$NGINX_CONFIG" |
        grep -iE
        '(^|[[:space:];])(add_header[[:space:]]+(Content-Security-Policy|X-Frame-Options)|proxy_hide_header|more_set_headers|more_clear_headers)'
      args:
        executable: /bin/bash
      environment:
        NGINX_CONFIG: "{{ docker_nginx_effective_config.stdout | default('') }}"
      register: docker_nginx_conflicting_directives
      changed_when: false
      failed_when: false
      when: docker_verify_clickjacking_headers | bool

    - name: Require shared Nginx not to override Laravel clickjacking headers
      ansible.builtin.assert:
        that:
          - docker_nginx_conflicting_directives.stdout | trim == ''
        fail_msg: >-
          Shared Nginx contains directives that may duplicate, hide, replace,
          or clear Laravel-owned clickjacking headers. Review the mounted
          shared-Nginx configuration.
        success_msg: >-
          Shared Nginx contains no CSP/X-Frame-Options or header-manipulation
          directives that compete with Laravel.
      when: docker_verify_clickjacking_headers | bool

    - name: Verify the final clickjacking headers from the configured URL
      ansible.builtin.uri:
        url: "{{ docker_clickjacking_verification_url }}"
        method: HEAD
        return_content: false
        follow_redirects: safe
        status_code: 200,301,302,303,307,308
      register: docker_clickjacking_http_response
      changed_when: false
      when:
        - docker_verify_clickjacking_headers | bool
        - docker_clickjacking_verification_url | trim | length > 0

    - name: Assert final response contains the Laravel clickjacking headers once
      ansible.builtin.assert:
        that:
          - >-
            (docker_clickjacking_http_response.headers['content-security-policy'] |
            default('')) | trim == "frame-ancestors 'none'"
          - >-
            (docker_clickjacking_http_response.headers['x-frame-options'] |
            default('')) | trim == 'DENY'
        fail_msg: >-
          The verified response does not match the Laravel-owned baseline:
          Content-Security-Policy frame-ancestors 'none' and X-Frame-Options DENY.
          Check reverse proxies and duplicate headers at every deployment layer.
        success_msg: >-
          Final response preserves the expected Laravel clickjacking headers.
      when:
        - docker_verify_clickjacking_headers | bool
        - docker_clickjacking_verification_url | trim | length > 0

    - name: Show deployment summary and next step
      ansible.builtin.debug:
        msg:
          - "Project Name: {{ laravel_project_name }}"
          - "Project Path: {{ laravel_project_dir }}"
          - "Laravel Repo Name: {{ laravel_repo_name }}"
          - "Laravel Source Folder: {{ laravel_webapp_name }}"
          - "Laravel Source Path: {{ laravel_webapp_dir }}"
          - "Domain: {{ laravel_domain }}"
          - "PHP Container: {{ laravel_php_container }}"
          - "Container Application Path: {{ laravel_container_app_dir }}"
          - "PHP Runtime Version: {{ laravel_php_version }}"
          - "PHP Runtime Version Verified: {{ laravel_runtime_php_version.stdout | default('unknown') | trim }}"
          - "Composer PHP Runtime: {{ laravel_runtime_php_version.stdout | default('unknown') | trim }}"
          - "Final Compose Build: completed with services kept in detached mode"
          - "Database Enabled: {{ laravel_use_db }}"
          - >-
            PII Database Backup:
            {{ laravel_pii_db_backup_file
               if laravel_pii_setup and laravel_pii_db_backup_required
               else 'not requested' }}
          - >-
            PII Follow-up Process:
            {{ 'completed' if laravel_pii_backfill | default(false)
               else 'skipped' }}
          - "GeoServer Enabled: {{ laravel_use_geoserver }}"
          - "NPM Setup Run: {{ laravel_npm_setup }}"
          - "NPM Tool Node Version: {{ laravel_node_version }}"
          - "NPM Tool npm Version: {{ laravel_npm_version }}"
          - "NPM Dependency Policy: package.json is preserved; package-lock.json is generated when missing and normalized when required"
          - "PHP running check: {{ laravel_final_php_state.stdout | default('unknown') }}"
          - "Shared Nginx: configured and reloaded for this Laravel project"
