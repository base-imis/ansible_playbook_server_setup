        python3 <<'PY'
        import os
        from pathlib import Path

        import yaml

        compose_path = Path(os.environ["COMPOSE_FILE"])
        nginx_container = os.environ["NGINX_CONTAINER"]

        with compose_path.open("r", encoding="utf-8") as stream:
            compose = yaml.safe_load(stream)

        services = compose.get("services") if isinstance(compose, dict) else None
        if not isinstance(services, dict):
            raise SystemExit("Compose file must contain a services mapping")

        removed = []
        for service_name, service in list(services.items()):
            if isinstance(service, dict) and service.get("container_name") == nginx_container:
                del services[service_name]
                removed.append(service_name)

        if removed:
            temporary_path = compose_path.with_name(compose_path.name + ".tmp")
            with temporary_path.open("w", encoding="utf-8") as stream:
                yaml.safe_dump(
                    compose,
                    stream,
                    default_flow_style=False,
                    sort_keys=False,
                    allow_unicode=True,
                )
            temporary_path.replace(compose_path)
            print("UPDATED: " + ", ".join(removed))
        else:
            print("UNCHANGED")
        PY
      args:
        executable: /bin/bash
      environment:
        COMPOSE_FILE: "{{ laravel_compose_file }}"
        NGINX_CONTAINER: "nginx-{{ laravel_project_name }}"
