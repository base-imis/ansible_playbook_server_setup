---
- name: Deploy one Laravel web application using the original script workflow
  hosts: hardening_target
  become: true
  gather_facts: true

  # These prompts are a fallback only. If the same variables are supplied
  # with -e @vars/project.yml (including an Ansible Vault-encrypted file),
  # Ansible uses the supplied values and skips the corresponding prompts.
  # Otherwise, each prompt uses its matching vault_<variable_name> value as
  # the default. Seed prompts use vault_seed_* names for shorter .env mapping.
  vars_prompt:
    - name: laravel_project_name
      prompt: "Project name"
      private: false
      default: "{{ vault_laravel_project_name | default('myapp') }}"
    - name: laravel_repo
      prompt: "Laravel project repo URL (HTTPS, e.g. https://github.com/user/repo.git)"
      private: false
      default: "{{ vault_laravel_repo | default('') }}"
    - name: laravel_webapp_name_input
      prompt: "Web app folder name (leave blank to use PROJECT_NAME-REPO_NAME)"
      private: false
      default: "{{ vault_laravel_webapp_name_input | default('') }}"
    - name: laravel_branch
      prompt: "Git branch"
      private: false
      default: "{{ vault_laravel_branch | default('main') }}"
    - name: laravel_domain
      prompt: "Domain/subdomain"
      private: false
      default: "{{ vault_laravel_domain | default('app.local') }}"
    - name: laravel_use_db_input
      prompt: "Use database? (y/n)"
      private: false
      default: "{{ vault_laravel_use_db_input | default('n') }}"
    - name: laravel_use_geoserver_input
      prompt: "Use GeoServer? (y/n)"
      private: false
      default: "{{ vault_laravel_use_geoserver_input | default('n') }}"
    - name: laravel_pii_setup_input
      prompt: "Configure the PII encryption feature? (y/n)"
      private: false
      default: "{{ vault_laravel_pii_setup_input | default('n') }}"
    - name: laravel_empty_database_input
      prompt: "Is the database completely empty? (y/n)"
      private: false
      default: "{{ vault_laravel_empty_database_input | default('n') }}"
    - name: laravel_npm_setup_input
      prompt: "Run npm setup? (y/n)"
      private: false
      default: "{{ vault_laravel_npm_setup_input | default('y') }}"
    - name: laravel_base_path
      prompt: "Base path"
      private: false
      default: "{{ vault_laravel_base_path | default('/home/innovative') }}"
    - name: laravel_template_repo
      prompt: "Docker template repository"
      private: false
      default: "{{ vault_laravel_template_repo | default('https://github.com/imis-base-docker.git') }}"
    - name: laravel_template_branch
      prompt: "Docker template Git branch"
      private: false
      default: "{{ vault_laravel_template_branch | default('main') }}"
    - name: laravel_proceed_existing_input
      prompt: "Proceed if the project directory already exists? (y/n)"
      private: false
      default: "{{ vault_laravel_proceed_existing_input | default('n') }}"
    - name: laravel_db_type
      prompt: "Database type (local/remote); ignored when database is disabled"
      private: false
      default: "{{ vault_laravel_db_type | default('local') }}"
    - name: laravel_pg_network
      prompt: "PostgreSQL network name; kept for parity with the Bash prompt"
      private: false
      default: "{{ vault_laravel_pg_network | default('postgres14_backend') }}"
    - name: laravel_shared_web_network
      prompt: "Shared web Docker network name"
      private: false
      default: "{{ vault_laravel_shared_web_network | default('shared-web') }}"
    - name: docker_verify_clickjacking_headers_input
      prompt: "Verify Laravel-owned clickjacking headers in shared Nginx? (yes/no)"
      private: false
      default: "{{ vault_docker_verify_clickjacking_headers_input | default('yes') }}"
    - name: docker_clickjacking_verification_url
      prompt: "Optional public URL for final clickjacking-header verification (blank to skip)"
      private: false
      default: "{{ vault_docker_clickjacking_verification_url | default('') }}"
    - name: laravel_php_version
      prompt: "PHP major.minor.patch version for PHP, Artisan and Composer containers"
      private: false
      default: "{{ vault_laravel_php_version | default('8.2.35') }}"

    - name: laravel_db_host
      prompt: "PostgreSQL container name or database host"
      private: false
      default: "{{ vault_laravel_db_host | default('postgres14') }}"
    - name: laravel_db_port
      prompt: "Database port"
      private: false
      default: "{{ vault_laravel_db_port | default('5432') }}"
    - name: laravel_db_name
      prompt: "Database name; leave blank to use project name"
      private: false
      default: "{{ vault_laravel_db_name | default('') }}"
    - name: laravel_db_user
      prompt: "Database username"
      private: false
      default: "{{ vault_laravel_db_user | default('app') }}"
    - name: laravel_db_password
      prompt: "Database user password; leave blank when database is disabled"
      private: true
      confirm: true
      default: "{{ vault_laravel_db_password | default('') }}"
    - name: laravel_geoserver_workspace
      prompt: "GeoServer workspace name; ignored when GeoServer is disabled"
      private: false
      default: "{{ vault_laravel_geoserver_workspace | default('workspace') }}"
    - name: laravel_geoserver_auth_key
      prompt: "GeoServer AuthKey secret (optional; press Enter to skip)"
      private: true
      default: "{{ vault_laravel_geoserver_auth_key | default('') }}"
    - name: laravel_google_api_key
      prompt: "Google API key (optional; press Enter to skip)"
      private: true
      default: "{{ vault_laravel_google_api_key | default('') }}"
    - name: laravel_app_name
      prompt: "App name"
      private: false
      default: "{{ vault_laravel_app_name | default('Laravel') }}"
    - name: laravel_app_env
      prompt: "App environment (local/production)"
      private: false
      default: "{{ vault_laravel_app_env | default('production') }}"
    - name: laravel_app_debug
      prompt: "App debug (true/false)"
      private: false
      default: "{{ vault_laravel_app_debug | default('false') }}"
    - name: laravel_extra_env
      prompt: "Additional environment entries separated by semicolons (KEY=value;KEY2=value2), or leave blank"
      private: true
      default: "{{ vault_laravel_extra_env | default('') }}"
    - name: laravel_seed_super_admin_name
      prompt: "SEED_SUPER_ADMIN_NAME"
      private: false
      default: "{{ vault_seed_super_admin_name | default('') }}"
    - name: laravel_seed_super_admin_username
      prompt: "SEED_SUPER_ADMIN_USERNAME"
      private: false
      default: "{{ vault_seed_super_admin_username | default('') }}"
    - name: laravel_seed_super_admin_email
      prompt: "SEED_SUPER_ADMIN_EMAIL"
      private: false
      default: "{{ vault_seed_super_admin_email | default('') }}"
    - name: laravel_seed_super_admin_password
      prompt: "SEED_SUPER_ADMIN_PASSWORD"
      private: true
      confirm: true
      default: "{{ vault_seed_super_admin_password | default('') }}"
  vars:
    laravel_use_db: "{{ laravel_use_db_input | lower in ['y', 'yes', 'true', '1'] }}"
    laravel_use_geoserver: "{{ laravel_use_geoserver_input | lower in ['y', 'yes', 'true', '1'] }}"
    laravel_pii_setup: "{{ laravel_pii_setup_input | default('n') | lower in ['y', 'yes', 'true', '1'] }}"
    laravel_database_empty: "{{ laravel_empty_database_input | default('n') | lower in ['y', 'yes', 'true', '1'] }}"
    # PII processing always requires a successful database backup; no prompt.
    laravel_pii_db_backup_required: true
    laravel_pii_backfill: false
    laravel_run_url_binding: false
    laravel_npm_setup: "{{ laravel_npm_setup_input | lower in ['y', 'yes', 'true', '1'] }}"
    laravel_proceed_existing: "{{ laravel_proceed_existing_input | lower in ['y', 'yes', 'true', '1'] }}"
    laravel_project_dir: "{{ laravel_base_path }}/{{ laravel_project_name }}"
    # Accept GitHub HTTPS URLs with or without a trailing .git or slash, then
    # normalize them to one clean credential-free URL. Never put a username or
    # PAT in laravel_repo or laravel_template_repo.
    laravel_repo_clean: >-
      {{
        (laravel_repo | trim
        | regex_replace('/+$', '')
        | regex_replace('\.git$', '')) ~ '.git'
      }}
    laravel_template_repo_clean: >-
      {{
        (laravel_template_repo | trim
        | regex_replace('/+$', '')
        | regex_replace('\.git$', '')) ~ '.git'
      }}

    # Extract the repository name from the normalized Laravel Git URL.
    # Example: https://github.com/org/imis-mahalaxmi.git -> imis-mahalaxmi
    laravel_repo_name: >-
      {{
        laravel_repo_clean
        | regex_replace('^.*/', '')
        | regex_replace('\.git$', '')
      }}

    # The user may provide any valid folder name. When left blank, use
    # PROJECT_NAME-REPO_NAME, for example base-mahalaxmi-imis-mahalaxmi.
    laravel_webapp_name: >-
      {{
        laravel_webapp_name_input | trim
        if laravel_webapp_name_input | trim | length > 0
        else laravel_project_name ~ '-' ~ laravel_repo_name
      }}

    # Host source directory. The container application path intentionally
    # remains based only on the project name.
    laravel_webapp_dir: "{{ laravel_project_dir }}/src/{{ laravel_webapp_name }}"
    laravel_container_app_dir: "/var/www/html/{{ laravel_project_name }}"
    laravel_compose_file: "{{ laravel_base_path }}/{{ laravel_project_name }}/docker-compose.yml"
    laravel_tools_override_file: "{{ laravel_project_dir }}/docker-compose.ansible-tools.yml"
    laravel_package_lock_backup: "{{ laravel_webapp_dir }}/package-lock.json.ansible-original"
    # Laravel Mix 6.0.49 imports webpack's internal SizeFormatHelpers module.
    # webpack 5.106.x no longer provides that module at the expected path;
    # 5.97.1 remains compatible with this legacy Mix build.
    laravel_webpack_compat_version: "5.97.1"
    laravel_webpackbar_compat_version: "5.0.2"
    laravel_effective_db_name: "{{ laravel_db_name if laravel_db_name | length > 0 else laravel_project_name }}"
    # GeoServer is reached internally over Docker DNS, not through a public URL.
    # The GeoServer playbook attaches its container to geoserver_proxy with the
    # container name geo.
    laravel_geoserver_network: "{{ vault_laravel_geoserver_network | default('geoserver_proxy') }}"
    laravel_geoserver_host: "{{ vault_laravel_geoserver_host | default('geo') }}"
    laravel_geoserver_url: "http://{{ laravel_geoserver_host }}:8080/geoserver/"
    laravel_geoserver_internal_url: "{{ laravel_geoserver_url }}{{ laravel_geoserver_workspace }}/"
    laravel_mapfish_print_url: "{{ laravel_geoserver_url }}pdf/print.pdf"
    laravel_php_container: "php-{{ laravel_project_name }}"
    laravel_shared_nginx_dir: "{{ laravel_base_path }}/shared-nginx"
    laravel_shared_nginx_container: "shared-nginx"
    laravel_shared_nginx_image: "nginx:alpine"
    laravel_shared_nginx_config_file: "{{ laravel_shared_nginx_dir }}/nginx/nginx.conf"
    laravel_shared_project_config_file: "{{ laravel_shared_nginx_dir }}/nginx/conf.d/{{ laravel_project_name }}.conf"
    docker_nginx_container_name: "shared-nginx"
    laravel_queue_worker_container: "queue-worker-{{ laravel_project_name }}"
    laravel_npm_container: "npm-{{ laravel_project_name }}"
    laravel_composer_service: "composer"
    laravel_npm_service: "npm"
    # This tool image is used only for dependency install/build tasks and
    # does not change package.json or package-lock.json.
    laravel_node_image: "node:22-bookworm-slim"
    laravel_node_version: "22"
    laravel_npm_version: "10.9.2"
    laravel_npm_tool_image: "{{ laravel_project_name }}-npm-tool:node{{ laravel_node_version }}-npm{{ laravel_npm_version }}"
    laravel_npm_tool_dockerfile: "{{ laravel_project_dir }}/Dockerfile.ansible-npm"
    laravel_swiper_package_json: "{{ laravel_webapp_dir }}/node_modules/swiper/package.json"
    laravel_artisan_service: "artisan"
    laravel_pii_key_host_file: "{{ laravel_base_path }}/secure-keys/base-imis-pii-v1.key"
    laravel_pii_key_backup_file: "/var/backups/base-imis/secure-keys/base-imis-pii-v1.key"
    laravel_pii_db_backup_dir: "/var/backups/base-imis/database"
    laravel_pii_db_backup_file: "{{ laravel_pii_db_backup_dir }}/{{ laravel_project_name }}-pre-pii-{{ ansible_date_time.iso8601_basic_short }}.dump"
    laravel_pii_key_container_file: "/run/secrets/base-imis-pii-v1.key"
    laravel_wkhtmltopdf_image: "ghcr.io/surnet/alpine-wkhtmltopdf:3.23.4-0.12.6-full"
    laravel_wkhtmltopdf_helper: "/tmp/ansible_fix_php_wkhtmltopdf.py"
    docker_verify_clickjacking_headers: >-
      {{ docker_verify_clickjacking_headers_input | trim | lower
         in ['yes', 'y', 'true', '1'] }}

    # Run every Git operation as the SSH/deployment user instead of root.
    # The play itself uses become: true for Docker/system administration, but
    # running Git as root against a repository owned by the deployment user
    # triggers Git's "dubious ownership" protection. This defaults to the
    # inventory ansible_user (for example innovative) and can be overridden
    # from the Vault with laravel_git_user if required.
    laravel_git_user: "{{ ansible_user | default('innovative') }}"

    # Keep the temporary credential values in /run, but place the executable
    # AskPass helper in /usr/local/bin because /run may be mounted noexec.
    # The files are owned by laravel_git_user with restrictive permissions so
    # Git can read them while other normal users cannot. They are removed in
    # an always block after repository access.
    laravel_git_askpass_path: "/usr/local/bin/ansible_github_askpass_{{ laravel_project_name }}.sh"
    laravel_git_username_path: "/run/ansible_github_username_{{ laravel_project_name }}"
    laravel_git_token_path: "/run/ansible_github_token_{{ laravel_project_name }}"
    # GitHub credentials are requested later only when an unauthenticated
    # public-access check fails for at least one repository.
    # Preferred Vault variable names are github_username and github_token.
    # github_password is accepted only as a backward-compatible fallback.

  pre_tasks:
    - name: Set defaults for skipped feature-specific prompts
      ansible.builtin.set_fact:
        laravel_db_type: "{{ laravel_db_type | default('local') }}"
        laravel_pg_network: "{{ laravel_pg_network | default('postgres14_backend') }}"
        laravel_db_host: "{{ laravel_db_host | default('postgres14') }}"
        laravel_db_port: "{{ laravel_db_port | default('5432') }}"
        laravel_db_name: "{{ laravel_db_name | default('') }}"
        laravel_db_user: "{{ laravel_db_user | default('app') }}"
        laravel_db_password: "{{ laravel_db_password | default('') }}"
        laravel_geoserver_workspace: "{{ laravel_geoserver_workspace | default('workspace') }}"
        laravel_geoserver_auth_key: "{{ laravel_geoserver_auth_key | default('') }}"
        laravel_google_api_key: "{{ laravel_google_api_key | default('') }}"

    - name: Validate deployment input
      ansible.builtin.assert:
        that:
          - laravel_project_name is match('^[A-Za-z0-9_-]+$')
          - laravel_webapp_name is match('^[A-Za-z0-9._-]+$')
          - laravel_repo | trim | length > 0
          - laravel_repo | trim is match('^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(?:\.git)?/?$')
          - laravel_template_repo | trim is match('^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(?:\.git)?/?$')
          - laravel_branch | length > 0
          - laravel_template_branch | length > 0
          - laravel_domain is match('^[A-Za-z0-9.-]+$')
          - laravel_php_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
          - laravel_db_port | int > 0
          - laravel_db_port | int < 65536
          - laravel_app_debug | lower in ['true', 'false']
          - not laravel_use_db or laravel_db_password | length > 0
          - docker_clickjacking_verification_url | trim == '' or
            docker_clickjacking_verification_url is match('^https?://[^ ]+$')
        fail_msg: "One or more deployment values are invalid."

    - name: Resolve deployment user UID
      ansible.builtin.command:
        argv:
          - id
          - -u
          - "{{ laravel_git_user }}"
      register: laravel_uid_result
      changed_when: false

    - name: Resolve deployment user GID
      ansible.builtin.command:
        argv:
          - id
          - -g
          - "{{ laravel_git_user }}"
      register: laravel_gid_result
      changed_when: false

    - name: Store deployment user IDs
      ansible.builtin.set_fact:
        laravel_uid: "{{ laravel_uid_result.stdout | trim }}"
        laravel_gid: "{{ laravel_gid_result.stdout | trim }}"

    - name: Check required commands
      ansible.builtin.command:
        argv: "{{ item.argv }}"
      loop:
        - name: Docker
          argv: [docker, --version]
        - name: Docker Compose
          argv: [docker, compose, version]
        - name: Git
          argv: [git, --version]
      loop_control:
        label: "{{ item.name }}"
      changed_when: false

    # Check both repositories without credentials first. A successful
    # git ls-remote means the repository is publicly readable and no GitHub
    # credential prompt is necessary. GitHub intentionally does not reveal
    # whether a failed unauthenticated URL is private or nonexistent, so any
    # failure is treated as "authentication required" and is verified again
    # during the authenticated clone.
    - name: Check whether Docker template repository is publicly accessible
      become: true
      become_user: "{{ laravel_git_user }}"
      ansible.builtin.command:
        argv:
          - git
          - ls-remote
          - "{{ laravel_template_repo_clean }}"
      environment:
        GIT_TERMINAL_PROMPT: "0"
      register: laravel_template_public_check
      changed_when: false
      failed_when: false

    - name: Check whether Laravel repository is publicly accessible
      become: true
      become_user: "{{ laravel_git_user }}"
      ansible.builtin.command:
        argv:
          - git
          - ls-remote
          - "{{ laravel_repo_clean }}"
      environment:
        GIT_TERMINAL_PROMPT: "0"
      register: laravel_repo_public_check
      changed_when: false
      failed_when: false

    - name: Store repository access status
      ansible.builtin.set_fact:
        laravel_template_repo_public: "{{ laravel_template_public_check.rc == 0 }}"
        laravel_repo_public: "{{ laravel_repo_public_check.rc == 0 }}"
        github_auth_required: >-
          {{ laravel_template_public_check.rc != 0 or laravel_repo_public_check.rc != 0 }}

    - name: Show repository access mode
      ansible.builtin.debug:
        msg:
          - "Docker template repository public: {{ laravel_template_repo_public }}"
          - "Laravel repository public: {{ laravel_repo_public }}"
          - >-
            {{ 'GitHub credentials are required for at least one repository.'
               if github_auth_required
               else 'Both repositories are public; GitHub credentials will not be requested.' }}

    # github_username/github_token or vault_github_username/vault_github_token
    # may come from an encrypted vars file. If they were not supplied, keep
    # the original interactive fallback.
    - name: Ask for GitHub username only when authentication is required and no value was supplied
      ansible.builtin.pause:
        prompt: >-
          GitHub username [press Enter to use vault_github_username when configured]
        echo: true
      register: github_username_prompt
      when:
        - github_auth_required
        - github_username | default(vault_github_username | default('')) | trim | length == 0
      no_log: true

    - name: Ask for GitHub token only when authentication is required and no value was supplied
      ansible.builtin.pause:
        prompt: >-
          GitHub token [press Enter to use vault_github_token when configured]
        echo: false
      register: github_token_prompt
      when:
        - github_auth_required
        - github_token | default(github_password | default(vault_github_token | default(''))) | length == 0
      no_log: true

    - name: Resolve GitHub credentials from Vault variables or interactive fallback
      ansible.builtin.set_fact:
        github_username_effective: >-
          {{
            github_username | default(vault_github_username | default('')) | trim
            if github_username | default(vault_github_username | default('')) | trim | length > 0
            else github_username_prompt.user_input | default(vault_github_username | default('')) | trim
          }}
        github_token_effective: >-
          {{
            github_token | default(github_password | default(vault_github_token | default('')))
            if github_token | default(github_password | default(vault_github_token | default(''))) | length > 0
            else github_token_prompt.user_input | default(vault_github_token | default(''))
          }}
      when: github_auth_required
      no_log: true

    - name: Validate GitHub credentials were supplied
      ansible.builtin.assert:
        that:
          - github_username_effective | default('') | length > 0
          - github_token_effective | default('') | length > 0
        fail_msg: >-
          GitHub username and token are required for a private
          repository. Supply github_username/github_token in the encrypted
          vars file or enter them when prompted.
      when: github_auth_required
      no_log: true

    - name: Check base path
      ansible.builtin.stat:
        path: "{{ laravel_base_path }}"
      register: laravel_base_stat

    - name: Require existing base path
      ansible.builtin.assert:
        that:
          - laravel_base_stat.stat.isdir | default(false)
        fail_msg: "Base path does not exist: {{ laravel_base_path }}"

    - name: Check project directory
      ansible.builtin.stat:
        path: "{{ laravel_project_dir }}"
      register: laravel_project_stat

    - name: Require confirmation before using an existing project directory
      ansible.builtin.assert:
        that:
          - not laravel_project_stat.stat.exists or laravel_proceed_existing
        fail_msg: "Project directory already exists. Rerun and approve proceeding only after reviewing it."

    # Previous playbook versions could create/modify the repository as root.
    # Normalize ownership before any Git operation so reruns do not fail with
    # "detected dubious ownership" or write-permission errors.
    - name: Ensure existing project tree is owned by the Git deployment user
      ansible.builtin.file:
        path: "{{ laravel_project_dir }}"
        owner: "{{ laravel_git_user }}"
        recurse: true
      when:
        - laravel_project_stat.stat.exists
        - laravel_proceed_existing

  tasks:
    # Bash STEPS 2-3 - Clone the Docker template and Laravel source.
    #
    # IMPORTANT:
    # GitHub credentials are NEVER embedded in an HTTPS repository URL.
    # For private repositories, a temporary GIT_ASKPASS helper reads the
    # username/token from deployment-user-only files. Git therefore stores only
    # the normalized clean URL in .git/config, for example:
    #   https://github.com/ORG/REPOSITORY.git
    #
    # Clone/ls-remote tasks intentionally do NOT use no_log. Their command
    # lines contain only clean URLs, so a Git failure remains visible instead
    # of being replaced by Ansible's "censored" message. The credential-file
    # creation tasks remain no_log and the files are deleted in an always block.
    # All repository operations run as laravel_git_user, avoiding root-owned Git
    # state and Git's dubious-ownership protection on reruns.
    - name: Clone repositories using clean GitHub URLs
      block:
        - name: Create temporary GitHub username file
          ansible.builtin.copy:
            dest: "{{ laravel_git_username_path }}"
            owner: "{{ laravel_git_user }}"
            mode: "0600"
            content: "{{ github_username_effective | default('') }}\n"
          when: github_auth_required
          no_log: true

        - name: Create temporary GitHub token file
          ansible.builtin.copy:
            dest: "{{ laravel_git_token_path }}"
            owner: "{{ laravel_git_user }}"
            mode: "0600"
            content: "{{ github_token_effective | default('') }}\n"
          when: github_auth_required
          no_log: true

        - name: Create temporary GitHub AskPass helper
          ansible.builtin.copy:
            dest: "{{ laravel_git_askpass_path }}"
            owner: "{{ laravel_git_user }}"
            mode: "0700"
            content: |
              #!/bin/sh
              case "$1" in
                *Username*)
                  cat "{{ laravel_git_username_path }}"
                  ;;
                *Password*)
                  cat "{{ laravel_git_token_path }}"
                  ;;
                *)
                  exit 1
                  ;;
              esac
          when: github_auth_required
          no_log: true

        # Validate private repository credentials before attempting a clone.
        # The token is not part of argv/stdout/stderr, so authentication errors
        # remain visible and useful for troubleshooting.
        - name: Verify authenticated Docker template repository access
          become: true
          become_user: "{{ laravel_git_user }}"
          ansible.builtin.command:
            argv:
              - git
              - ls-remote
              - "{{ laravel_template_repo_clean }}"
          environment:
            GIT_TERMINAL_PROMPT: "0"
            GIT_ASKPASS: "{{ laravel_git_askpass_path }}"
            GIT_ASKPASS_REQUIRE: "force"
          changed_when: false
          when: not laravel_template_repo_public

        - name: Verify authenticated Laravel repository access
          become: true
          become_user: "{{ laravel_git_user }}"
          ansible.builtin.command:
            argv:
              - git
              - ls-remote
              - "{{ laravel_repo_clean }}"
          environment:
            GIT_TERMINAL_PROMPT: "0"
            GIT_ASKPASS: "{{ laravel_git_askpass_path }}"
            GIT_ASKPASS_REQUIRE: "force"
          changed_when: false
          when: not laravel_repo_public

        # Bash STEP 2 - Clone and prepare the Docker template.
        - name: Check whether the Docker template is already prepared
          ansible.builtin.stat:
            path: "{{ laravel_compose_file }}"
          register: laravel_template_ready

        - name: Clone the public Docker template repository
          become: true
          become_user: "{{ laravel_git_user }}"
          ansible.builtin.git:
            repo: "{{ laravel_template_repo_clean }}"
            dest: "{{ laravel_project_dir }}"
            depth: 1
            version: "{{ laravel_template_branch }}"
          environment:
            GIT_TERMINAL_PROMPT: "0"
          when:
            - not laravel_template_ready.stat.exists
            - laravel_template_repo_public

        - name: Clone the private Docker template repository
          become: true
          become_user: "{{ laravel_git_user }}"
          ansible.builtin.git:
            repo: "{{ laravel_template_repo_clean }}"
            dest: "{{ laravel_project_dir }}"
            depth: 1
            version: "{{ laravel_template_branch }}"
          environment:
            GIT_TERMINAL_PROMPT: "0"
            GIT_ASKPASS: "{{ laravel_git_askpass_path }}"
            GIT_ASKPASS_REQUIRE: "force"
          when:
            - not laravel_template_ready.stat.exists
            - not laravel_template_repo_public

        - name: Check Docker template Git metadata
          ansible.builtin.stat:
            path: "{{ laravel_project_dir }}/.git/config"
          register: laravel_template_git_config

        - name: Ensure Docker template origin URL contains no credentials
          become: true
          become_user: "{{ laravel_git_user }}"
          ansible.builtin.command:
            argv:
              - git
              - remote
              - set-url
              - origin
              - "{{ laravel_template_repo_clean }}"
          args:
            chdir: "{{ laravel_project_dir }}"
          register: laravel_template_origin_clean
          changed_when: false
          when: laravel_template_git_config.stat.exists

        # Bash STEP 3 - Clone the Laravel source.
        - name: Check whether Laravel source is already present
          ansible.builtin.stat:
            path: "{{ laravel_webapp_dir }}/composer.json"
          register: laravel_source_ready

        - name: Ensure the Laravel source parent exists
          ansible.builtin.file:
            path: "{{ laravel_project_dir }}/src"
            state: directory
            owner: "{{ laravel_uid }}"
            group: "{{ laravel_gid }}"
            mode: "0755"

        - name: Clone the public Laravel repository
          become: true
          become_user: "{{ laravel_git_user }}"
          ansible.builtin.git:
            repo: "{{ laravel_repo_clean }}"
            dest: "{{ laravel_webapp_dir }}"
            version: "{{ laravel_branch }}"
            depth: 1
          environment:
            GIT_TERMINAL_PROMPT: "0"
          when:
            - not laravel_source_ready.stat.exists
            - laravel_repo_public

        - name: Clone the private Laravel repository
          become: true
          become_user: "{{ laravel_git_user }}"
          ansible.builtin.git:
            repo: "{{ laravel_repo_clean }}"
            dest: "{{ laravel_webapp_dir }}"
            version: "{{ laravel_branch }}"
            depth: 1
          environment:
            GIT_TERMINAL_PROMPT: "0"
            GIT_ASKPASS: "{{ laravel_git_askpass_path }}"
            GIT_ASKPASS_REQUIRE: "force"
          when:
            - not laravel_source_ready.stat.exists
            - not laravel_repo_public

        - name: Check Laravel Git metadata
          ansible.builtin.stat:
            path: "{{ laravel_webapp_dir }}/.git/config"
          register: laravel_source_git_config

        - name: Ensure Laravel origin URL contains no credentials
          become: true
          become_user: "{{ laravel_git_user }}"
          ansible.builtin.command:
            argv:
              - git
              - remote
              - set-url
              - origin
              - "{{ laravel_repo_clean }}"
          args:
            chdir: "{{ laravel_webapp_dir }}"
          register: laravel_source_origin_clean
          changed_when: false
          when: laravel_source_git_config.stat.exists

        - name: Read Laravel origin URL for verification
          become: true
          become_user: "{{ laravel_git_user }}"
          ansible.builtin.command:
            argv:
              - git
              - remote
              - get-url
              - origin
          args:
            chdir: "{{ laravel_webapp_dir }}"
          register: laravel_source_origin_url
          changed_when: false
          when: laravel_source_git_config.stat.exists

        - name: Verify Laravel origin URL is clean
          ansible.builtin.assert:
            that:
              - laravel_source_origin_url.stdout | trim == laravel_repo_clean
              - "'@github.com' not in (laravel_source_origin_url.stdout | trim)"
            fail_msg: >-
              Laravel origin URL is not clean. Expected {{ laravel_repo_clean }},
              got {{ laravel_source_origin_url.stdout | default('unknown') | trim }}.
          when: laravel_source_git_config.stat.exists

      always:
        - name: Remove temporary GitHub AskPass helper
          ansible.builtin.file:
            path: "{{ laravel_git_askpass_path }}"
            state: absent
          changed_when: false
          no_log: true

        - name: Remove temporary GitHub username file
          ansible.builtin.file:
            path: "{{ laravel_git_username_path }}"
            state: absent
          changed_when: false
          no_log: true

        - name: Remove temporary GitHub token file
          ansible.builtin.file:
            path: "{{ laravel_git_token_path }}"
            state: absent
          changed_when: false
          no_log: true

    # Keep the Laravel repository .git directory so future git status/pull
    # operations can be performed directly from the deployed source folder.
    # Its origin URL is intentionally stored without username/password/PAT.

    # Bash STEP 4 - Replace template names and internal application paths.
    #
    # Older versions created timestamped backups while scanning every file
    # under dockerfiles. On each rerun, those backup files were scanned and
    # backed up again, causing continuously growing file names.
    - name: Find obsolete timestamped Ansible backup files
      ansible.builtin.find:
        paths:
          - "{{ laravel_project_dir }}"
        file_type: file
        recurse: true
        use_regex: true
        patterns:
          - '.*\.[0-9]+\.[0-9]{4}-[0-9]{2}-[0-9]{2}@[0-9]{2}:[0-9]{2}:[0-9]{2}~$'
      register: laravel_obsolete_timestamp_backups

    - name: Remove obsolete timestamped Ansible backup files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ laravel_obsolete_timestamp_backups.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Check stable Docker Compose backup
      ansible.builtin.stat:
        path: "{{ laravel_compose_file }}.pre_ansible"
      register: laravel_compose_stable_backup

    - name: Create one stable Docker Compose backup
      ansible.builtin.copy:
        src: "{{ laravel_compose_file }}"
        dest: "{{ laravel_compose_file }}.pre_ansible"
        remote_src: true
        mode: preserve
      when: not laravel_compose_stable_backup.stat.exists

    - name: Repair duplicated generated names from older non-idempotent playbook runs
      ansible.builtin.shell: |
        set -euo pipefail

        python3 <<'PY'
        import os
        import re
        from pathlib import Path

        project_dir = Path(os.environ["PROJECT_DIR"])
        compose_file = Path(os.environ["COMPOSE_FILE"])
        project_name = os.environ["PROJECT_NAME"]
        container_app_dir = os.environ["CONTAINER_APP_DIR"]

        # Older revisions matched the prefix "imis" again after it had already
        # been replaced.  For an imis-choma project that could produce values
        # such as imis-choma-choma on each rerun.  Repair only that historical
        # pattern; already-correct values remain untouched.
        if not project_name.startswith("imis"):
            print("UNCHANGED")
            raise SystemExit(0)

        repeated_suffix = project_name[len("imis"):]
        if not repeated_suffix:
            print("UNCHANGED")
            raise SystemExit(0)

        expected_tokens = [
            f"nginx-{project_name}",
            f"php-{project_name}",
            f"queue-worker-{project_name}",
            f"composer-{project_name}",
            f"npm-{project_name}",
            f"artisan-{project_name}",
            container_app_dir,
        ]

        patterns = [
            (
                re.compile(re.escape(expected) + f"(?:{re.escape(repeated_suffix)})+"),
                expected,
            )
            for expected in expected_tokens
        ]

        files = [compose_file]
        dockerfiles_dir = project_dir / "dockerfiles"
        if dockerfiles_dir.is_dir():
            for path in dockerfiles_dir.rglob("*"):
                if path.is_file() and (
                    path.name.endswith(".dockerfile")
                    or path.name.endswith(".conf")
                    or path.name.endswith(".ini")
                ):
                    files.append(path)

        changed_files = []
        for path in files:
            try:
                original = path.read_text(encoding="utf-8")
            except UnicodeDecodeError:
                continue

            updated = original
            for pattern, replacement in patterns:
                updated = pattern.sub(replacement, updated)

            if updated != original:
                path.write_text(updated, encoding="utf-8")
                changed_files.append(str(path))

        if changed_files:
            print("UPDATED")
            for path in changed_files:
                print(path)
        else:
            print("UNCHANGED")
        PY
      args:
        executable: /bin/bash
      environment:
        PROJECT_DIR: "{{ laravel_project_dir }}"
        COMPOSE_FILE: "{{ laravel_compose_file }}"
        PROJECT_NAME: "{{ laravel_project_name }}"
        CONTAINER_APP_DIR: "{{ laravel_container_app_dir }}"
      register: laravel_duplicate_name_repair
      changed_when: "'UPDATED' in laravel_duplicate_name_repair.stdout"

    - name: Replace Docker Compose template placeholders
      ansible.builtin.replace:
        path: "{{ laravel_compose_file }}"
        regexp: "{{ item.regexp }}"
        replace: "{{ item.replace }}"
        backup: false
      loop:
        # Rename only the HOST Laravel source folder in Compose. This avoids
        # accidentally replacing the application path inside the containers.
        - regexp: 'src/(?:imis-revamp2\.0|web_app)(?![A-Za-z0-9_.-])'
          replace: "src/{{ laravel_webapp_name }}"

        # Container names are generated from the project name.
        - {
            regexp: "nginx-imis(?![A-Za-z0-9_-])",
            replace: "nginx-{{ laravel_project_name }}",
          }
        - {
            regexp: "php-imis(?![A-Za-z0-9_-])",
            replace: "php-{{ laravel_project_name }}",
          }
        - {
            regexp: "queue-worker-imis(?![A-Za-z0-9_-])",
            replace: "queue-worker-{{ laravel_project_name }}",
          }
        - {
            regexp: "composer-imis(?![A-Za-z0-9_-])",
            replace: "composer-{{ laravel_project_name }}",
          }
        - {
            regexp: "npm-imis(?![A-Za-z0-9_-])",
            replace: "npm-{{ laravel_project_name }}",
          }
        - {
            regexp: "artisan-imis(?![A-Za-z0-9_-])",
            replace: "artisan-{{ laravel_project_name }}",
          }

        # The application path inside containers is also project-specific.
        - regexp: "/var/www/html/(?:imis|web_app)(?![A-Za-z0-9_.-])"
          replace: "{{ laravel_container_app_dir }}"

    - name: Find only active Docker template files
      ansible.builtin.find:
        paths: "{{ laravel_project_dir }}/dockerfiles"
        file_type: file
        recurse: true
        use_regex: false
        patterns:
          - "*.dockerfile"
          - "*.conf"
          - "*.ini"
        excludes:
          - "*.bak.ansible"
          - "*.pre_ansible"
          - "*~"
      register: laravel_docker_template_files

    - name: Replace old IMIS application paths in active Docker template files
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: "/var/www/html/(?:imis|web_app)(?![A-Za-z0-9_.-])"
        replace: "{{ laravel_container_app_dir }}"
        backup: false
      loop: "{{ laravel_docker_template_files.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Ensure Python YAML support is installed before reading Compose
      ansible.builtin.apt:
        name: python3-yaml
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Install Dockerfile correction helper
      ansible.builtin.copy:
        dest: "{{ laravel_wkhtmltopdf_helper }}"
        owner: root
        group: root
        mode: "0700"
        content: |
          import os
          import re
          from pathlib import Path

          import yaml

          compose_file = Path(os.environ["COMPOSE_FILE"]).resolve()
          php_version = os.environ["PHP_VERSION"]
          php_container = os.environ["PHP_CONTAINER"]
          artisan_service = os.environ["ARTISAN_SERVICE"]
          composer_service = os.environ["COMPOSER_SERVICE"]
          wkhtmltopdf_image = os.environ["WKHTMLTOPDF_IMAGE"]

          with compose_file.open("r", encoding="utf-8") as stream:
              compose = yaml.safe_load(stream)

          if not isinstance(compose, dict):
              raise SystemExit(f"Invalid Docker Compose YAML: {compose_file}")

          services = compose.get("services")
          if not isinstance(services, dict):
              raise SystemExit("Docker Compose services section is missing or invalid")


          def find_service_by_container_name(container_name):
              for service_name, service in services.items():
                  if (
                      isinstance(service, dict)
                      and service.get("container_name") == container_name
                  ):
                      return service_name
              return None


          def resolve_dockerfile(service_name):
              service = services.get(service_name)
              if not isinstance(service, dict):
                  return None

              build = service.get("build")
              if build is None:
                  return None

              if isinstance(build, str):
                  context = build
                  dockerfile = "Dockerfile"
              elif isinstance(build, dict):
                  context = build.get("context", ".")
                  dockerfile = build.get("dockerfile", "Dockerfile")
              else:
                  raise SystemExit(
                      f"Unsupported build configuration for service {service_name}"
                  )

              context_path = Path(context)
              if not context_path.is_absolute():
                  context_path = (compose_file.parent / context_path).resolve()

              dockerfile_path = Path(dockerfile)
              if not dockerfile_path.is_absolute():
                  dockerfile_path = (context_path / dockerfile_path).resolve()

              return dockerfile_path


          def remove_managed_block(content, begin_marker, end_marker):
              pattern = re.compile(
                  rf"(?ms)^{re.escape(begin_marker)}\r?\n.*?"
                  rf"^{re.escape(end_marker)}(?:\r?\n)?"
              )
              return pattern.sub("", content)


          def split_dockerfile_chunks(content):
              """Split Dockerfile text into logical instructions and plain lines."""
              chunks = []
              current = []

              for line in content.splitlines(keepends=True):
                  stripped = line.strip()

                  if not current and (not stripped or stripped.startswith("#")):
                      chunks.append(line)
                      continue

                  current.append(line)

                  # A trailing backslash continues the current instruction.
                  if line.rstrip("\r\n").rstrip().endswith("\\"):
                      continue

                  chunks.append("".join(current))
                  current = []

              if current:
                  chunks.append("".join(current))

              return chunks


          def is_apk_add_instruction(chunk):
              if not re.match(r"(?is)^\s*RUN\b", chunk):
                  return False

              # Supports both `apk add` and `apk --no-cache add` forms.
              return bool(
                  re.search(
                      r"(?is)\bapk\b(?:(?!\b(?:apk|RUN)\b).)*?\badd\b",
                      chunk,
                  )
              )


          def remove_package_from_instruction(chunk, package):
              package_pattern = re.compile(
                  rf"(?<![A-Za-z0-9_.+-]){re.escape(package)}"
                  rf"(?![A-Za-z0-9_.+-])"
              )

              if not package_pattern.search(chunk):
                  return chunk

              original_lines = chunk.splitlines(keepends=True)
              cleaned_lines = []

              for line in original_lines:
                  cleaned = package_pattern.sub("", line)
                  line_ending = ""

                  if cleaned.endswith("\r\n"):
                      line_ending = "\r\n"
                      body = cleaned[:-2]
                  elif cleaned.endswith("\n"):
                      line_ending = "\n"
                      body = cleaned[:-1]
                  else:
                      body = cleaned

                  # Remove a continuation line that contained only the package.
                  if body.strip() in {"", "\\"}:
                      continue

                  body = re.sub(r"[ \t]{2,}", " ", body).rstrip()
                  cleaned_lines.append(body + line_ending)

              # If the removed package was the final continuation item,
              # remove the now-invalid trailing backslash from the prior line.
              if cleaned_lines:
                  last = cleaned_lines[-1]
                  newline = ""
                  if last.endswith("\r\n"):
                      newline = "\r\n"
                      body = last[:-2]
                  elif last.endswith("\n"):
                      newline = "\n"
                      body = last[:-1]
                  else:
                      body = last

                  if body.rstrip().endswith("\\"):
                      body = body.rstrip()[:-1].rstrip()
                      cleaned_lines[-1] = body + newline

              return "".join(cleaned_lines)


          def remove_wkhtmltopdf_from_apk_instructions(content):
              updated_chunks = []

              for chunk in split_dockerfile_chunks(content):
                  if is_apk_add_instruction(chunk):
                      chunk = remove_package_from_instruction(
                          chunk,
                          "wkhtmltopdf",
                      )
                  updated_chunks.append(chunk)

              return "".join(updated_chunks)


          def find_apk_instruction_with_package(content, package):
              package_pattern = re.compile(
                  rf"(?<![A-Za-z0-9_.+-]){re.escape(package)}"
                  rf"(?![A-Za-z0-9_.+-])"
              )

              for chunk in split_dockerfile_chunks(content):
                  if is_apk_add_instruction(chunk) and package_pattern.search(chunk):
                      return chunk

              return None


          php_service = find_service_by_container_name(php_container)
          if php_service is None and "php" in services:
              php_service = "php"

          if php_service is None:
              raise SystemExit(
                  f"Could not find the PHP service for container {php_container}"
              )

          php_dockerfile = resolve_dockerfile(php_service)
          artisan_dockerfile = resolve_dockerfile(artisan_service)
          composer_dockerfile = resolve_dockerfile(composer_service)

          required = {
              f"PHP service '{php_service}'": php_dockerfile,
              f"Composer service '{composer_service}'": composer_dockerfile,
          }

          missing = [
              f"{label}: {path}"
              for label, path in required.items()
              if path is None or not path.is_file()
          ]
          if missing:
              raise SystemExit(
                  "Required Dockerfile(s) could not be resolved from "
                  "docker-compose.yml: " + "; ".join(missing)
              )

          runtime_dockerfiles = [php_dockerfile]
          if artisan_dockerfile is not None:
              if not artisan_dockerfile.is_file():
                  raise SystemExit(
                      "Artisan Dockerfile was resolved from Compose but was not found: "
                      f"{artisan_dockerfile}"
                  )
              runtime_dockerfiles.append(artisan_dockerfile)

          runtime_dockerfiles = list(dict.fromkeys(runtime_dockerfiles))

          changed = False
          modified_paths = []


          def write_if_changed(path, original, updated):
              global changed

              if updated == original:
                  return

              backup = path.with_name(path.name + ".bak.ansible")
              if not backup.exists():
                  backup.write_text(original, encoding="utf-8")

              path.write_text(updated, encoding="utf-8")
              modified_paths.append(str(path))
              changed = True


          stage_begin = "# BEGIN ANSIBLE MANAGED WKHTMLTOPDF STAGE"
          stage_end = "# END ANSIBLE MANAGED WKHTMLTOPDF STAGE"
          runtime_begin = "# BEGIN ANSIBLE MANAGED WKHTMLTOPDF RUNTIME"
          runtime_end = "# END ANSIBLE MANAGED WKHTMLTOPDF RUNTIME"
          zip_begin = "# BEGIN ANSIBLE MANAGED PHP ZIP EXTENSION"
          zip_end = "# END ANSIBLE MANAGED PHP ZIP EXTENSION"

          stage_block = (
              f"{stage_begin}\n"
              f"FROM {wkhtmltopdf_image} AS wkhtmltopdf\n"
              f"{stage_end}\n\n"
          )

          runtime_block = (
              f"\n{runtime_begin}\n"
              "RUN apk add --no-cache \\\n"
              "    libstdc++ \\\n"
              "    libx11 \\\n"
              "    libxrender \\\n"
              "    libxext \\\n"
              "    libssl3 \\\n"
              "    ca-certificates \\\n"
              "    fontconfig \\\n"
              "    freetype \\\n"
              "    ttf-dejavu \\\n"
              "    ttf-droid \\\n"
              "    ttf-freefont \\\n"
              "    ttf-liberation\n\n"
              "COPY --from=wkhtmltopdf "
              "/bin/wkhtmltopdf /bin/wkhtmltopdf\n"
              "COPY --from=wkhtmltopdf "
              "/bin/wkhtmltoimage /bin/wkhtmltoimage\n"
              "COPY --from=wkhtmltopdf "
              "/lib/libwkhtmltox* /lib/\n\n"
              "RUN chmod 0755 "
              "/bin/wkhtmltopdf /bin/wkhtmltoimage\n"
              f"{runtime_end}\n"
          )

          zip_block = (
              f"\n{zip_begin}\n"
              "RUN apk add --no-cache libzip-dev zip unzip \\\n"
              "    && apk add --no-cache --virtual .zip-build-deps $PHPIZE_DEPS \\\n"
              "    && docker-php-ext-install zip \\\n"
              "    && docker-php-ext-enable zip \\\n"
              "    && apk del .zip-build-deps\n"
              f"{zip_end}\n"
          )

          php_from_pattern = re.compile(
              r"(?m)^FROM[ \t]+php:[^\s]+"
              r"(?P<alias>[ \t]+AS[ \t]+\S+)?[ \t]*$"
          )

          for dockerfile in runtime_dockerfiles:
              original = dockerfile.read_text(encoding="utf-8")
              updated = original

              updated = remove_managed_block(updated, stage_begin, stage_end)
              updated = remove_managed_block(updated, runtime_begin, runtime_end)
              updated = remove_managed_block(updated, zip_begin, zip_end)
              updated = updated.lstrip("\r\n")

              updated, replacements = php_from_pattern.subn(
                  lambda match: (
                      f"FROM php:{php_version}-fpm-alpine"
                      f"{match.group('alias') or ''}"
                  ),
                  updated,
                  count=1,
              )

              if replacements != 1:
                  raise SystemExit(
                      f"Could not identify a PHP base image in {dockerfile}"
                  )

              updated = remove_wkhtmltopdf_from_apk_instructions(updated)

              php_from_match = php_from_pattern.search(updated)
              if php_from_match is None:
                  raise SystemExit(
                      f"Could not find the pinned PHP FROM line in {dockerfile}"
                  )

              before_php_stage = updated[:php_from_match.start()].rstrip("\r\n")
              php_stage_and_after = updated[php_from_match.start():].lstrip("\r\n")
              if before_php_stage:
                  before_php_stage += "\n\n"

              updated = before_php_stage + stage_block + php_stage_and_after

              php_from_match = php_from_pattern.search(updated)
              if php_from_match is None:
                  raise SystemExit(
                      f"Could not find the PHP runtime stage in {dockerfile}"
                  )

              insert_at = php_from_match.end()
              content_after_php_from = updated[insert_at:].lstrip("\r\n")
              updated = (
                  updated[:insert_at]
                  + runtime_block
                  + zip_block
                  + "\n"
                  + content_after_php_from
              )

              write_if_changed(dockerfile, original, updated)

          original = composer_dockerfile.read_text(encoding="utf-8")
          updated = original

          updated = remove_managed_block(updated, zip_begin, zip_end)

          composer_from_pattern = re.compile(
              r"(?m)^FROM[ \t]+\S+"
              r"(?P<alias>[ \t]+AS[ \t]+\S+)?[ \t]*$"
          )
          updated, replacements = composer_from_pattern.subn(
              lambda match: (
                  f"FROM php:{php_version}-cli-alpine"
                  f"{match.group('alias') or ''}"
              ),
              updated,
              count=1,
          )

          if replacements != 1:
              raise SystemExit(
                  f"Could not identify the Composer base image in {composer_dockerfile}"
              )

          composer_from_match = composer_from_pattern.search(updated)
          if composer_from_match is None:
              raise SystemExit(
                  f"Could not find the Composer FROM line in {composer_dockerfile}"
              )

          insert_at = composer_from_match.end()
          content_after_composer_from = updated[insert_at:]
          if zip_begin not in content_after_composer_from.split(
              "ENTRYPOINT", 1
          )[0]:
              updated = (
                  updated[:insert_at]
                  + zip_block
                  + content_after_composer_from
              )

          composer_copy = (
              "COPY --from=composer:2 "
              "/usr/bin/composer /usr/local/bin/composer"
          )

          if composer_copy not in updated:
              first_from = composer_from_pattern.search(updated)
              if first_from is None:
                  raise SystemExit(
                      f"Could not find the Composer FROM line in {composer_dockerfile}"
                  )

              insert_at = first_from.end()
              updated = (
                  updated[:insert_at]
                  + "\n\n"
                  + composer_copy
                  + updated[insert_at:]
              )

          updated = re.sub(
              r'(?m)^ENTRYPOINT\s+\[\s*"composer"\s*\]\s*$\n?',
              "",
              updated,
          ).rstrip() + '\n\nENTRYPOINT ["composer"]\n'

          write_if_changed(composer_dockerfile, original, updated)

          expected_fpm = f"FROM php:{php_version}-fpm-alpine"
          expected_cli = f"FROM php:{php_version}-cli-alpine"

          for dockerfile in runtime_dockerfiles:
              content = dockerfile.read_text(encoding="utf-8")
              required_runtime_items = (
                  expected_fpm,
                  f"FROM {wkhtmltopdf_image} AS wkhtmltopdf",
                  "COPY --from=wkhtmltopdf "
                  "/bin/wkhtmltopdf /bin/wkhtmltopdf",
                  "COPY --from=wkhtmltopdf "
                  "/bin/wkhtmltoimage /bin/wkhtmltoimage",
                  "COPY --from=wkhtmltopdf "
                  "/lib/libwkhtmltox* /lib/",
                  "docker-php-ext-install zip",
              )

              for expected in required_runtime_items:
                  if expected not in content:
                      raise SystemExit(
                          f"Dockerfile verification failed: "
                          f"{expected} is missing from {dockerfile}"
                      )

              invalid_instruction = find_apk_instruction_with_package(
                  content,
                  "wkhtmltopdf",
              )
              if invalid_instruction is not None:
                  raise SystemExit(
                      "The unavailable Alpine wkhtmltopdf package is still "
                      f"present in an apk add instruction in {dockerfile}:\n"
                      f"{invalid_instruction}"
                  )

          composer_content = composer_dockerfile.read_text(encoding="utf-8")
          for expected in (
              expected_cli,
              composer_copy,
              'ENTRYPOINT ["composer"]',
              "docker-php-ext-install zip",
          ):
              if expected not in composer_content:
                  raise SystemExit(
                      f"Composer Dockerfile verification failed: "
                      f"{expected} is missing from {composer_dockerfile}"
                  )

          print("UPDATED" if changed else "UNCHANGED")
          print(f"PHP service: {php_service}")
          print(f"PHP Dockerfile: {php_dockerfile}")
          if artisan_dockerfile is not None:
              print(f"Artisan Dockerfile: {artisan_dockerfile}")
          else:
              print("Artisan service has no separate build Dockerfile.")
          print(f"Composer Dockerfile: {composer_dockerfile}")
          print(f"wkhtmltopdf image: {wkhtmltopdf_image}")
          if modified_paths:
              print("Modified Dockerfiles: " + ", ".join(modified_paths))

