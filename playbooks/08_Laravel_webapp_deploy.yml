    - name: Attach PHP service to shared-web without requiring per-project Nginx
      ansible.builtin.shell: |
        set -euo pipefail

        python3 <<'PY'
        import os
        from pathlib import Path

        import yaml

        compose_path = Path(os.environ["COMPOSE_FILE"])
        php_container = os.environ["PHP_CONTAINER"]
        shared_web_network = os.environ["SHARED_WEB_NETWORK"]

        with compose_path.open("r", encoding="utf-8") as stream:
            compose = yaml.safe_load(stream)

        if not isinstance(compose, dict):
            raise SystemExit("Compose file must contain a top-level YAML mapping")

        services = compose.get("services")
        if not isinstance(services, dict) or not services:
            raise SystemExit("Compose file must contain a non-empty services mapping")

        changed = False
        legacy_network_names = {"laravel"}

        # Modern Compose ignores the legacy version key.
        if "version" in compose:
            compose.pop("version")
            changed = True

        # shared-nginx talks directly to php-PROJECT:9000.  A project-specific
        # nginx container is therefore not required by this deployment playbook.
        php_service_name = None

        for service_name, service in services.items():
            if not isinstance(service, dict):
                continue
            if service.get("container_name") == php_container:
                php_service_name = service_name
                break

        # Original template normally calls this service "php".
        if php_service_name is None and "php" in services:
            php_service_name = "php"

        if php_service_name is None:
            available = ", ".join(services.keys())
            raise SystemExit(
                f"Could not find PHP service for container {php_container}. "
                f"Available services: {available}"
            )

        php_service = services[php_service_name]
        networks = php_service.get("networks")

        # Attach every application service to the shared external network.
        # This matches the reference Compose layout and allows shared Nginx
        # and the application-side services to use the same Docker network.
        for service_name, service in services.items():
            if not isinstance(service, dict):
                continue

            networks = service.get("networks")
            if isinstance(networks, list):
                filtered_networks = [
                    network
                    for network in networks
                    if network not in legacy_network_names
                ]
                if filtered_networks != networks:
                    service["networks"] = filtered_networks
                    networks = filtered_networks
                    changed = True
                if shared_web_network not in networks:
                    networks.append(shared_web_network)
                    changed = True
            elif isinstance(networks, dict):
                for legacy_network in legacy_network_names:
                    if legacy_network in networks:
                        networks.pop(legacy_network)
                        changed = True
                if shared_web_network not in networks:
                    networks[shared_web_network] = None
                    changed = True
            elif networks is None:
                service["networks"] = [shared_web_network]
                changed = True
            else:
                raise SystemExit(
                    f"Unsupported networks configuration for service {service_name}"
                )

        top_networks = compose.setdefault("networks", {})
        if not isinstance(top_networks, dict):
            raise SystemExit("Top-level networks must be a YAML mapping")

        for legacy_network in legacy_network_names:
            if legacy_network in top_networks and legacy_network != shared_web_network:
                top_networks.pop(legacy_network)
                changed = True

        required_shared_network = {
            "external": True,
            "name": shared_web_network,
        }

        if top_networks.get(shared_web_network) != required_shared_network:
            top_networks[shared_web_network] = required_shared_network
            changed = True

        if changed:
            temporary_path = compose_path.with_name(compose_path.name + ".tmp")
            with temporary_path.open("w", encoding="utf-8") as stream:
                yaml.safe_dump(
                    compose,
                    stream,
                    default_flow_style=False,
                    sort_keys=False,
                    allow_unicode=True,
                )
            temporary_path.replace(compose_path)

        print(f"PHP service: {php_service_name}")
        print("UPDATED" if changed else "UNCHANGED")
        PY
      args:
        executable: /bin/bash
      environment:
        COMPOSE_FILE: "{{ laravel_compose_file }}"
        PHP_CONTAINER: "{{ laravel_php_container }}"
        SHARED_WEB_NETWORK: "{{ laravel_shared_web_network }}"
      register: laravel_shared_web_update
      changed_when: "'UPDATED' in laravel_shared_web_update.stdout"

    - name: Validate Compose after shared-web update
